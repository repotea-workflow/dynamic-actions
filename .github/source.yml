commit:
  message: "Lock online resource consumers out of Release freeze (#295)\n\nClassify online catalogs separately from Release freeze so live edits stay online and banners are not rebuilt.\n\nA new native Build Spec rejects online catalogs. Freeze pins only packaging brand bytes, confirmed permissions, and the storage-binding revision. Identical freeze input replays the stored Spec digest, including storageBuildCreatedAt, without allocating another build number or writing native_build.freeze.\n\nStudio users, roles, permissions, feedback, and device/business routes stay in place."
