  message: "test(hawk): signing grants must not mutate packaging drafts (AVIARY-111) (#298)\n\n* test(hawk): assert signing grants do not mutate packaging drafts\n\nDocument AVIARY-111 boundary that grant enable/disable leaves app packaging\ndraft revision and configuration unchanged after tenant signing operations.\n\n* test(hawk): drop redundant platform_owner bindings in tenant_signing\n\nFixture::from_state already binds platform_owner; duplicate inserts\nviolated avr_role_bindings_active_unique_idx in dynamic_app_db CI.\n\n* test(hawk): re-bind platform_owner after tenant_role for draft setup\n\ntenant_role revokes all role bindings for the fixture identity, so\nplatform packaging draft writes need a single bind_platform_owner call\nbefore seeding the shared app draft. Avoids duplicate inserts while\nkeeping platform-only PUT paths authorized.\n\n---------\n\nCo-authored-by: 0x128bit <306828631+0x128bit@users.noreply.github.com>"
