commit:
  message: "fix(graphic-editor): fix text italic slant, QR labels, bundled icons, and canvas size (#451)\n\n* fix(graphic-editor): fix text italic slant, QR label rendering, bundled icons, and canvas size\n\nImplements M6 Batch 1 editor tool fixes:\n- Normalize text italic slant to italicLeft for forward slash skew and localize default inserted text (Refs #410)\n- Add gprinter_qr_code_svg helper for live canvas and headless print QR label rendering with XML escaping and adaptive truncation (Refs #411)\n- Bundle 18 original monochrome SVG editor icons across 3 Chinese categories with IP blocklist filtering and asset:// hydration (Refs #412)\n- Make GprinterMobileFrameSizePill interactive with modal canvas size preset and custom WxH sheet in compact and wide layouts (Refs #413)\n\n* fix(graphic-editor): address root sheet insets, table italic parity, and icon guards\n\n- Mount canvas size modal on root Navigator so compact 360x640 layouts keep actions reachable and preserve keyboard viewInsets (Refs #413).\n- Wrap table element plugin in gprinterPlatePlugins to normalize legacy italic styles on the live canvas while retaining table config capability (Refs #410).\n- Fold fullwidth ASCII and zero-width/whitespace separators in editor icon IP filtering and replace unhydrated remote gprinterIcon entries with a placeholder shape in headless SVG rendering (Refs #412)."
