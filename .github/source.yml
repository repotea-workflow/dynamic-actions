commit:
  message: "Apply a frozen theme scope to each feature route\n\nProduct feature routes, including print preview and feedback threads, apply the frozen theme for that feature. Switching or returning does not reuse another feature's theme or asset overrides.\n\nStyleAssetIcon reads the current feature theme key and asset overrides. A product widget without a theme scope fails. Explicit development compositions may keep their presentation fallback keys, and isolated PLUME widget tests install that development scope.\n\nThe assembler passes parsed frozen theme bindings into AppAssembly.resolved."
