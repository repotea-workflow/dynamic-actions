commit:
  message: "Add the Build Spec v2 appConfiguration contract (#308)\n\n* Add the Build Spec v2 appConfiguration contract.\n\nProject explicit, dependency, and resolved features, presentation bindings,\nfrozen themes, shell, and digests from one common snapshot. Android and iOS\ncite that snapshot, retries do not reload live configuration, and secrets stay\nout of the spec.\n\n* Share one live appConfiguration snapshot across platforms.\n\nKeep platform targets, signing, and frozen inputs out of the live resource digest so Android and iOS cite the same common snapshot when their frozen themes match.\n\n* Pin API checks to the appConfiguration contract consumer.\n\nThe signing integration spec now includes appConfiguration, which the previous Buildbox pin rejects as an unknown field.\n\n---------\n\nCo-authored-by: 0x128bit <306828631+0x128bit@users.noreply.github.com>"
