commit:
  message: "Add tenant signing assets and immutable native app identities (#278)\n\n* Add tenant signing assets and seal native app identities\n\n* Verify validation requests and material tokens remain scoped\n\n* Add composition module activation for native feature entry. (#279)\n\nIntroduce FeatureOpener, aviary.image.launchEditor, Hawk activation passthrough, and KEEL IMAGE_PRINT PoC with a stub native editor\u2014no styleKey branching.\n\nCo-authored-by: 0x128bit <306828631+0x128bit@users.noreply.github.com>\n\n* Fix feature-styles-publish forwarding import flags to compile (#280)\n\n* Stop forwarding import flags to feature-styles compile.\n\nPublish only needs compile with default STAC base ref; import-only options were breaking flutter test dart-defines.\n\n* Route base-ref args to compile and keep import flags import-only.\n\nFilter transport and import CLI options before feature-styles-compile while still forwarding positional base refs.\n\n---------\n\nCo-authored-by: 0x128bit <306828631+0x128bit@users.noreply.github.com>\n\n* Fix feature-styles-publish when compile receives no args. (#281)\n\nWith set -u, expanding an empty compile_args array failed; cover import-only publish flags in routing test.\n\nCo-authored-by: 0x128bit <306828631+0x128bit@users.noreply.github.com>\n\n* Fix signing validation availability and legacy import authorization\n\n* Restore imported signing material readiness for Spec creation\n\n---------\n\nCo-authored-by: 0x128bit <306828631+0x128bit@users.noreply.github.com>"
