name: "[aviary] Check"

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  source:
    name: Resolve exact source revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - id: source
        uses: repotea-workspace/kangumi/github-actions/dyn-source@main
        with:
          repository: boxliy/aviary
          token: ${{ secrets.GH_TOKEN_0X128BIT }}

  check:
    needs: source
    name: Check repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/aviary
          token: ${{ secrets.GH_TOKEN_0X128BIT }}
          ref: ${{ needs.source.outputs.sha }}

      # taiki-e/install-action just
      - uses: taiki-e/install-action@782607f383d1c9d72a26177e2594cd8dad0f3840

      # pnpm/action-setup v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.2
          run_install: false

      # actions/setup-node v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: songbirds/pnpm-lock.yaml

      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.4
          channel: stable

      - name: Configure FVM command
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nif [ "$1" = exec ]; then\n  shift\n  PATH="$FLUTTER_ROOT/bin:$FLUTTER_ROOT/bin/cache/dart-sdk/bin:$PATH"\n  export PATH\n  exec "$@"\nfi\ncommand="$1"\nshift\nexec "$FLUTTER_ROOT/bin/$command" "$@"\n' > "$RUNNER_TEMP/bin/fvm"
          chmod +x "$RUNNER_TEMP/bin/fvm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Resolve Flutter dependencies
        working-directory: waterfowl
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0X128BIT }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: "!gh auth git-credential"
        run: fvm dart pub get --enforce-lockfile

      - name: Install dependencies
        run: |
          pnpm --dir songbirds install --frozen-lockfile
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit --file raptors/Cargo.lock

      - name: Checkout verified buildbox contract consumer
        uses: actions/checkout@v6
        with:
          repository: boxliy/buildbox
          token: ${{ secrets.GH_TOKEN_0X128BIT }}
          ref: 4b481c284bde4b416798794830640ba07ffab951
          path: .contract-buildbox
          persist-credentials: false

      - name: Verify repository
        env:
          BUILDBOX_CONTRACT_CONSUMER: ${{ github.workspace }}/.contract-buildbox/tests/consume_hawk_contract.py
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          trap 'just db-down' EXIT
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s waterfowl/tools/app_assembler
          just -f waterfowl/Justfile test
          just check
          pnpm --dir songbirds lint
          pnpm --dir songbirds test
          pnpm --dir songbirds build
          just -f waterfowl/Justfile format-check
          just db-up
          just migrate
          just test-db
          just smoke-backend

      - name: Verify real Alibaba OSS acceptance
        env:
          AVIARY_OSS_E2E_ACCESS_KEY_ID: ${{ secrets.AVIARY_OSS_E2E_ACCESS_KEY_ID }}
          AVIARY_OSS_E2E_ACCESS_KEY_SECRET: ${{ secrets.AVIARY_OSS_E2E_ACCESS_KEY_SECRET }}
          AVIARY_OSS_E2E_SECURITY_TOKEN: ${{ secrets.AVIARY_OSS_E2E_SECURITY_TOKEN }}
          AVIARY_OSS_E2E_BUCKET: ${{ secrets.AVIARY_OSS_E2E_BUCKET }}
          AVIARY_OSS_E2E_REGION: ${{ secrets.AVIARY_OSS_E2E_REGION }}
          AVIARY_OSS_E2E_CUSTOM_ENDPOINT: ${{ secrets.AVIARY_OSS_E2E_CUSTOM_ENDPOINT }}
          AVIARY_OSS_E2E_PREFIX: ${{ secrets.AVIARY_OSS_E2E_PREFIX }}
        run: |
          trap 'just db-down' EXIT
          just db-up
          just e2e-oss

  native-foundation:
    needs: source
    name: Native Flutter foundation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/aviary
          token: ${{ secrets.GH_TOKEN_0X128BIT }}
          ref: ${{ needs.source.outputs.sha }}
      - uses: taiki-e/install-action@782607f383d1c9d72a26177e2594cd8dad0f3840
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.4
          channel: stable
      - name: Configure FVM command
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\ncommand="$1"\nshift\nexec "$FLUTTER_ROOT/bin/$command" "$@"\n' > "$RUNNER_TEMP/bin/fvm"
          chmod +x "$RUNNER_TEMP/bin/fvm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        working-directory: waterfowl
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0X128BIT }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: "!gh auth git-credential"
        run: fvm flutter pub get --enforce-lockfile
      - name: Verify native foundation
        working-directory: waterfowl
        run: just check
      - name: Compile Android development host
        working-directory: waterfowl/apps/swan
        run: fvm flutter build apk --debug --no-pub

  native-ios-foundation:
    needs: source
    name: Native iOS foundation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/aviary
          token: ${{ secrets.GH_TOKEN_0X128BIT }}
          ref: ${{ needs.source.outputs.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.4
          channel: stable
      - name: Configure FVM command
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\ncommand="$1"\nshift\nexec "$FLUTTER_ROOT/bin/$command" "$@"\n' > "$RUNNER_TEMP/bin/fvm"
          chmod +x "$RUNNER_TEMP/bin/fvm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        working-directory: waterfowl
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0X128BIT }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: "!gh auth git-credential"
        run: fvm flutter pub get --enforce-lockfile
      - name: Compile iOS simulator host
        working-directory: waterfowl/apps/swan
        run: fvm flutter build ios --simulator --debug --no-pub
