name: "[ztoms] Check"

on:
  push:
    branches:
      - "**"

jobs:
  backend-java:
    name: Backend Java v4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/ztoms
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build v4 Java backend
        run: cd backend/java/omsk-pompeii && ./mvnw -B -DskipTests package

      - name: Check v4 migration wrapper
        run: bash -n scripts/v4_migrate.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build v4 Java backend image
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          file: docker/omsk-v4-java.Dockerfile
          platforms: linux/amd64
          provenance: false

  omsk-babylon-web:
    name: OMSK Babylon v4 web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/ztoms
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate

      - name: Check v4 Babylon web
        run: cd frontend && pnpm install --frozen-lockfile --filter omsk-babylon... && pnpm --filter omsk-babylon check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build v4 Babylon web image
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          file: docker/omsk-babylon-v4.Dockerfile
          platforms: linux/amd64
          provenance: false
