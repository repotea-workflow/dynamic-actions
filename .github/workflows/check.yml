name: "[plate] Check"

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  # Each trigger commit carries immutable source metadata. Key by trigger SHA so
  # concurrent source-branch pushes cannot cancel or share checkout state.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve Plate Source
    runs-on: ubuntu-latest
    outputs:
      source_commit_full: ${{ steps.source.outputs.source_commit_full }}
      source_branch: ${{ steps.source.outputs.source_branch }}
      source_repository: ${{ steps.source.outputs.source_repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read source metadata
        id: source
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0X128BIT }}
        run: |
          set -euo pipefail
          branch="$(cat .github/branch.txt)"
          commit="$(cat .github/commit.txt)"
          repository="$(cat .github/repository.txt)"
          commit_full="$(gh api "repos/${repository}/commits/${commit}" --jq .sha)"
          echo "source_branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "source_commit_full=${commit_full}" >> "$GITHUB_OUTPUT"
          echo "source_repository=${repository}" >> "$GITHUB_OUTPUT"

      - name: Checkout dynamic source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@e265ebca9b4a93aaf804be57c2687554dcc49dc7 # main verified 2026-08-05
        with:
          repository: boxliy/plate
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Verify checked-out source matches this trigger
        working-directory: .
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ steps.source.outputs.source_commit_full }}"
          branch="${{ steps.source.outputs.source_branch }}"
          if [ "$actual" != "$expected" ]; then
            echo "dynamic-branch race: checked out ${actual} but trigger recorded ${expected} (${branch})" >&2
            exit 1
          fi
          echo "checked out ${branch} at ${actual}"

  check:
    name: Plate - Repository Checks
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ needs.source.outputs.source_repository }}
          ref: ${{ needs.source.outputs.source_commit_full }}
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc

      - name: Map installed Flutter to melos SDK path
        run: |
          mkdir -p .fvm
          ln -s "$FLUTTER_ROOT" .fvm/flutter_sdk

      - name: Install melos
        run: dart pub global activate melos 2.9.0

      - name: Add pub cache bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Configure text engine source fallback for pre-Release checks
        run: |
          for pubspec in \
            packages/plate_text_engine/pubspec.yaml \
            packages/plate_text_engine_plate/pubspec.yaml \
            apps/plate_web_example/pubspec.yaml; do
            printf '\nhooks:\n  user_defines:\n    plate_text_engine:\n      PLATE_TEXT_ENGINE_BUILD_FROM_SOURCE: true\n      PLATE_TEXT_ENGINE_UNICODE_BACKEND: icu4c\n' >> "$pubspec"
          done

      - name: Run checks
        run: just check

      - name: Verify browser PNG preserves raster text pixels
        working-directory: packages/plate_editor_support
        run: flutter test --platform chrome test/plate_png_export_web_test.dart

  static:
    name: Text Engine - Static Packaging
    needs: source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plate_text_engine
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: boxliy/plate
          ref: ${{ needs.source.outputs.source_commit_full }}
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Analyze packaging sources
        run: dart analyze hook tool/platform test/platform_manifest_test.dart test/platform_hook_test.dart test/platform_clean_checkout_test.dart

  linux:
    name: Text Engine - Linux x64 (${{ matrix.backend }})
    needs: source
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages/plate_text_engine
    strategy:
      fail-fast: false
      matrix:
        backend: [icu4c, icu4x]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: boxliy/plate
          ref: ${{ needs.source.outputs.source_commit_full }}
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Install Rust target
        if: ${{ matrix.backend == 'icu4x' }}
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Build and verify artifact
        run: |
          set -euo pipefail
          dart tool/platform/build.dart "${{ matrix.backend }}" linux x64
          dart tool/platform/verify.dart "${{ matrix.backend }}" linux x64 --call
          artifact=artifacts/native/linux-x64/libplate_text_engine.so
          symbols="$(objdump -T "$artifact")"
          if grep -Eq 'GLIBC_2\.(3[6-9]|[4-9][0-9])|GLIBC_([3-9]|[1-9][0-9])\.' \
              <<< "$symbols"; then
            echo 'Linux artifact requires a glibc version newer than 2.35.' >&2
            grep -E 'GLIBC_[0-9]+' <<< "$symbols" >&2
            exit 1
          fi

      - name: Configure source-build hook for tests
        run: |
          printf '\nhooks:\n  user_defines:\n    plate_text_engine:\n      PLATE_TEXT_ENGINE_BUILD_FROM_SOURCE: true\n      PLATE_TEXT_ENGINE_UNICODE_BACKEND: %s\n' \
            "${{ matrix.backend }}" >> pubspec.yaml

      - name: Test FFI and hook registration
        run: |
          set -euo pipefail
          PLATE_TEXT_ENGINE_LIBRARY="$PWD/artifacts/native/linux-x64/libplate_text_engine.so" \
          PLATE_TEXT_ENGINE_HOOK_TARGET=linux \
          PLATE_TEXT_ENGINE_HOOK_ARCH=x64 \
            dart test test/native_engine_test.dart test/platform_manifest_test.dart test/platform_hook_test.dart test/freetype_patch_applicator_test.dart

      - name: Test clean ICU4X source fallback
        if: ${{ matrix.backend == 'icu4x' }}
        run: |
          set -euo pipefail
          dart test test/platform_clean_checkout_test.dart

      - name: Upload text engine artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plate-text-engine-${{ matrix.backend }}-linux-x64
          path: |
            packages/plate_text_engine/artifacts/native/linux-x64/libplate_text_engine.so
            packages/plate_text_engine/artifacts/release/plate-text-engine-v0.1.0-abi5-r1/plate-text-engine-${{ matrix.backend }}-linux-x64.gz
          if-no-files-found: error

  android:
    name: Text Engine - Android ${{ matrix.arch }} (${{ matrix.backend }})
    needs: source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plate_text_engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: icu4c
            arch: arm64
            clang_target: aarch64-linux-android
          - backend: icu4c
            arch: x64
            clang_target: x86_64-linux-android
          - backend: icu4x
            arch: arm64
            rust_target: aarch64-linux-android
            clang_target: aarch64-linux-android
          - backend: icu4x
            arch: x64
            rust_target: x86_64-linux-android
            clang_target: x86_64-linux-android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: boxliy/plate
          ref: ${{ needs.source.outputs.source_commit_full }}
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Install NDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Rust target
        if: ${{ matrix.backend == 'icu4x' }}
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.rust_target }}"

      - name: Build, inspect, and cross-link ABI5 raster probe
        run: |
          set -euo pipefail
          dart tool/platform/build.dart "${{ matrix.backend }}" android "${{ matrix.arch }}"
          dart tool/platform/verify.dart "${{ matrix.backend }}" android "${{ matrix.arch }}"
          artifact_dir="artifacts/native/android-${{ matrix.arch }}"
          clang="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.clang_target }}23-clang"
          "$clang" -I native/include tool/platform/abi_probe.c -L "$artifact_dir" -lplate_text_engine -Wl,--allow-shlib-undefined -o "$artifact_dir/abi_probe"
          file "$artifact_dir/abi_probe"

      - name: Test target hook registration
        run: |
          set -euo pipefail
          printf '\nhooks:\n  user_defines:\n    plate_text_engine:\n      PLATE_TEXT_ENGINE_BUILD_FROM_SOURCE: true\n      PLATE_TEXT_ENGINE_UNICODE_BACKEND: %s\n' \
            "${{ matrix.backend }}" >> pubspec.yaml
          PLATE_TEXT_ENGINE_HOOK_TARGET=android \
          PLATE_TEXT_ENGINE_HOOK_ARCH="${{ matrix.arch }}" \
            dart test test/platform_hook_test.dart

      - name: Upload text engine artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plate-text-engine-${{ matrix.backend }}-android-${{ matrix.arch }}
          path: |
            packages/plate_text_engine/artifacts/native/android-${{ matrix.arch }}/libplate_text_engine.so
            packages/plate_text_engine/artifacts/release/plate-text-engine-v0.1.0-abi5-r1/plate-text-engine-${{ matrix.backend }}-android-${{ matrix.arch }}.gz
          if-no-files-found: error

  apple:
    name: Text Engine - ${{ matrix.target }} ${{ matrix.arch }} (${{ matrix.backend }})
    needs: source
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/plate_text_engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: icu4c
            target: ios
            arch: arm64
            sdk: iphoneos
            clang_arch: arm64
            minimum_flag: -miphoneos-version-min=13.0
          - backend: icu4c
            target: ios-simulator
            arch: arm64
            sdk: iphonesimulator
            clang_arch: arm64
            minimum_flag: -mios-simulator-version-min=14.0
          - backend: icu4c
            target: ios-simulator
            arch: x64
            sdk: iphonesimulator
            clang_arch: x86_64
            minimum_flag: -mios-simulator-version-min=13.0
          - backend: icu4c
            target: macos
            arch: arm64
            sdk: macosx
            clang_arch: arm64
            minimum_flag: -mmacosx-version-min=13.0
          - backend: icu4c
            target: macos
            arch: x64
            sdk: macosx
            clang_arch: x86_64
            minimum_flag: -mmacosx-version-min=13.0
          - backend: icu4x
            target: ios
            arch: arm64
            rust_target: aarch64-apple-ios
            sdk: iphoneos
            clang_arch: arm64
            minimum_flag: -miphoneos-version-min=13.0
          - backend: icu4x
            target: ios-simulator
            arch: arm64
            rust_target: aarch64-apple-ios-sim
            sdk: iphonesimulator
            clang_arch: arm64
            minimum_flag: -mios-simulator-version-min=14.0
          - backend: icu4x
            target: ios-simulator
            arch: x64
            rust_target: x86_64-apple-ios
            sdk: iphonesimulator
            clang_arch: x86_64
            minimum_flag: -mios-simulator-version-min=13.0
          - backend: icu4x
            target: macos
            arch: arm64
            rust_target: aarch64-apple-darwin
            sdk: macosx
            clang_arch: arm64
            minimum_flag: -mmacosx-version-min=13.0
          - backend: icu4x
            target: macos
            arch: x64
            rust_target: x86_64-apple-darwin
            sdk: macosx
            clang_arch: x86_64
            minimum_flag: -mmacosx-version-min=13.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: boxliy/plate
          ref: ${{ needs.source.outputs.source_commit_full }}
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Install Rust target
        if: ${{ matrix.backend == 'icu4x' }}
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Build, inspect, and cross-link ABI5 raster probe
        run: |
          set -euo pipefail
          dart tool/platform/build.dart "${{ matrix.backend }}" "${{ matrix.target }}" "${{ matrix.arch }}"
          dart tool/platform/verify.dart "${{ matrix.backend }}" "${{ matrix.target }}" "${{ matrix.arch }}"
          artifact_dir="artifacts/native/${{ matrix.target }}-${{ matrix.arch }}"
          xcrun --sdk "${{ matrix.sdk }}" clang -arch "${{ matrix.clang_arch }}" "${{ matrix.minimum_flag }}" -I native/include tool/platform/abi_probe.c "$artifact_dir/libplate_text_engine.dylib" -o "$artifact_dir/abi_probe"
          file "$artifact_dir/abi_probe"

      - name: Test target hook registration
        run: |
          set -euo pipefail
          printf '\nhooks:\n  user_defines:\n    plate_text_engine:\n      PLATE_TEXT_ENGINE_BUILD_FROM_SOURCE: true\n      PLATE_TEXT_ENGINE_UNICODE_BACKEND: %s\n' \
            "${{ matrix.backend }}" >> pubspec.yaml
          PLATE_TEXT_ENGINE_HOOK_TARGET="${{ matrix.target }}" \
          PLATE_TEXT_ENGINE_HOOK_ARCH="${{ matrix.arch }}" \
          PLATE_TEXT_ENGINE_HOOK_IOS_SDK="${{ matrix.sdk }}" \
            dart test test/platform_hook_test.dart

      - name: Upload text engine artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plate-text-engine-${{ matrix.backend }}-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            packages/plate_text_engine/artifacts/native/${{ matrix.target }}-${{ matrix.arch }}/libplate_text_engine.dylib
            packages/plate_text_engine/artifacts/release/plate-text-engine-v0.1.0-abi5-r1/plate-text-engine-${{ matrix.backend }}-${{ matrix.target }}-${{ matrix.arch }}.gz
          if-no-files-found: error

  windows:
    name: Text Engine - Windows x64 (${{ matrix.backend }})
    needs: source
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/plate_text_engine
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        backend: [icu4c, icu4x]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: boxliy/plate
          ref: ${{ needs.source.outputs.source_commit_full }}
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Initialize Visual Studio x64 developer environment
        if: ${{ matrix.backend == 'icu4c' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Initialize MSYS2
        if: ${{ matrix.backend == 'icu4c' }}
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MSYS
          release: false
          update: true
          install: >-
            diffutils
            make
            python
            unzip

      - name: Install Rust target
        if: ${{ matrix.backend == 'icu4x' }}
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build and verify ICU4C artifact
        if: ${{ matrix.backend == 'icu4c' }}
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          dart tool/platform/build.dart icu4c windows x64
          dart tool/platform/verify.dart icu4c windows x64 --call

      - name: Build and verify ICU4X artifact
        if: ${{ matrix.backend == 'icu4x' }}
        run: |
          ./tool/platform/build_windows.ps1
          dart tool/platform/verify.dart icu4x windows x64 --call

      - name: Test target hook registration
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Add-Content -Path pubspec.yaml -Value "`nhooks:`n  user_defines:`n    plate_text_engine:`n      PLATE_TEXT_ENGINE_BUILD_FROM_SOURCE: true`n      PLATE_TEXT_ENGINE_UNICODE_BACKEND: ${{ matrix.backend }}"
          $env:PLATE_TEXT_ENGINE_HOOK_TARGET = "windows"
          $env:PLATE_TEXT_ENGINE_HOOK_ARCH = "x64"
          dart test test/platform_hook_test.dart

      - name: Upload text engine artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plate-text-engine-${{ matrix.backend }}-windows-x64
          path: |
            packages/plate_text_engine/artifacts/native/windows-x64/plate_text_engine.dll
            packages/plate_text_engine/artifacts/release/plate-text-engine-v0.1.0-abi5-r1/plate-text-engine-${{ matrix.backend }}-windows-x64.gz
          if-no-files-found: error

  web:
    name: Text Engine - Web wasm32 (${{ matrix.backend }})
    needs: source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plate_text_engine
    strategy:
      fail-fast: false
      matrix:
        backend: [icu4c, icu4x]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: boxliy/plate
          ref: ${{ needs.source.outputs.source_commit_full }}
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Install Rust target
        if: ${{ matrix.backend == 'icu4x' }}
        run: rustup target add wasm32-unknown-unknown

      - name: Build, verify, and smoke artifact
        run: |
          set -euo pipefail
          dart tool/platform/build.dart "${{ matrix.backend }}" web wasm32
          dart tool/platform/verify.dart "${{ matrix.backend }}" web wasm32
          node test/web_engine_smoke.mjs

      - name: Smoke Flutter example under a non-root base
        if: ${{ matrix.backend == 'icu4c' }}
        working-directory: .
        env:
          PLATE_TEXT_ENGINE_BUILD_FROM_SOURCE: "1"
          PLATE_TEXT_ENGINE_UNICODE_BACKEND: icu4c
        run: |
          printf '\nhooks:\n  user_defines:\n    plate_text_engine:\n      PLATE_TEXT_ENGINE_BUILD_FROM_SOURCE: true\n      PLATE_TEXT_ENGINE_UNICODE_BACKEND: icu4c\n' >> apps/plate_web_example/pubspec.yaml
          node apps/plate_web_example/tool/smoke_plate_text_engine_web.mjs

      - name: Upload ICU4C text engine artifact
        if: ${{ matrix.backend == 'icu4c' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plate-text-engine-icu4c-web-wasm32
          path: |
            packages/plate_text_engine/artifacts/web/web-wasm32/plate_text_engine.mjs
            packages/plate_text_engine/artifacts/web/web-wasm32/plate_text_engine.wasm
            packages/plate_text_engine/artifacts/web/web-wasm32/plate_text_engine.data
            packages/plate_text_engine/artifacts/release/plate-text-engine-v0.1.0-abi5-r1/plate-text-engine-icu4c-web-wasm32.mjs.gz
            packages/plate_text_engine/artifacts/release/plate-text-engine-v0.1.0-abi5-r1/plate-text-engine-icu4c-web-wasm32.wasm.gz
            packages/plate_text_engine/artifacts/release/plate-text-engine-v0.1.0-abi5-r1/plate-text-engine-icu4c-web-wasm32.data.gz
          if-no-files-found: error

      - name: Upload ICU4X text engine artifact
        if: ${{ matrix.backend == 'icu4x' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plate-text-engine-icu4x-web-wasm32
          path: |
            packages/plate_text_engine/artifacts/web/web-wasm32/plate_text_engine.mjs
            packages/plate_text_engine/artifacts/web/web-wasm32/plate_text_engine.wasm
            packages/plate_text_engine/artifacts/release/plate-text-engine-v0.1.0-abi5-r1/plate-text-engine-icu4x-web-wasm32.mjs.gz
            packages/plate_text_engine/artifacts/release/plate-text-engine-v0.1.0-abi5-r1/plate-text-engine-icu4x-web-wasm32.wasm.gz
          if-no-files-found: error

  collect:
    name: Text Engine - Collect Release Bundle
    needs:
      - source
      - linux
      - android
      - apple
      - windows
      - web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: boxliy/plate
          ref: ${{ needs.source.outputs.source_commit_full }}
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc

      - name: Resolve Dart dependencies
        working-directory: packages/plate_text_engine
        run: dart pub get

      - name: Download all text engine build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plate-text-engine-icu*
          path: downloaded-artifacts

      - name: Validate and assemble fixed release asset set
        env:
          SOURCE_REPOSITORY: ${{ needs.source.outputs.source_repository }}
          SOURCE_COMMIT: ${{ needs.source.outputs.source_commit_full }}
          SOURCE_BRANCH: ${{ needs.source.outputs.source_branch }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          release_tag=plate-text-engine-v0.1.0-abi5-r1
          publication_repository=repotea-workflow/dynamic-actions
          mkdir -p release-bundle/assets release-bundle/metadata upload
          (
            cd packages/plate_text_engine
            dart tool/platform/assemble_release.dart \
              ../../downloaded-artifacts \
              ../../release-bundle/metadata/plate_text_engine_manifest.release-candidate.json
          )
          find downloaded-artifacts -type f -name '*.gz' -print0 | \
            while IFS= read -r -d '' archive; do
              cp "$archive" "release-bundle/assets/$(basename "$archive")"
            done
          jq -r '.artifacts[].files[]."asset-name"' \
            release-bundle/metadata/plate_text_engine_manifest.release-candidate.json | \
            sort > release-bundle/metadata/release-assets.txt
          jq -n \
            --arg schema "plate-text-engine-release-candidate-v1" \
            --arg release_tag "$release_tag" \
            --arg publication_repository "$publication_repository" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg workflow_repository "$WORKFLOW_REPOSITORY" \
            --arg workflow_run_id "$WORKFLOW_RUN_ID" \
            --arg workflow_run_attempt "$WORKFLOW_RUN_ATTEMPT" \
            '{
              schema: $schema,
              "release-tag": $release_tag,
              "publication-repository": $publication_repository,
              source: {
                repository: $source_repository,
                commit: $source_commit,
                branch: $source_branch
              },
              workflow: {
                repository: $workflow_repository,
                "run-id": $workflow_run_id,
                "run-attempt": $workflow_run_attempt
              }
            }' > release-bundle/metadata/release-provenance.json
          (cd release-bundle && sha256sum assets/* > metadata/assets.sha256)
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C release-bundle -cf - . | gzip -n > "upload/${release_tag}-release-bundle.tar.gz"
          cp release-bundle/metadata/* upload/
          (cd upload && sha256sum "${release_tag}-release-bundle.tar.gz" > release-bundle.sha256)

      - name: Upload release bundle and assembly metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plate-text-engine-v0.1.0-abi5-r1-release-bundle
          path: upload
          if-no-files-found: error

  report:
    name: Report Plate Check Result
    if: ${{ always() }}
    needs:
      - source
      - check
      - static
      - linux
      - android
      - apple
      - windows
      - web
      - collect
    runs-on: ubuntu-latest
    steps:
      - name: Report downstream conclusion to the source commit
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0X128BIT }}
        run: |
          set -euo pipefail
          repository="${{ needs.source.outputs.source_repository }}"
          commit="${{ needs.source.outputs.source_commit_full }}"
          if [ -z "$repository" ] || [ -z "$commit" ]; then
            echo "source metadata is unavailable; cannot report plate/check" >&2
            exit 1
          fi
          state="success"
          for result in \
            "${{ needs.source.result }}" \
            "${{ needs.check.result }}" \
            "${{ needs.static.result }}" \
            "${{ needs.linux.result }}" \
            "${{ needs.android.result }}" \
            "${{ needs.apple.result }}" \
            "${{ needs.windows.result }}" \
            "${{ needs.web.result }}" \
            "${{ needs.collect.result }}"; do
            if [ "$result" = "cancelled" ]; then
              state="error"
              break
            fi
            if [ "$result" != "success" ]; then
              state="failure"
            fi
          done
          gh api \
            --method POST \
            "repos/${repository}/statuses/${commit}" \
            -f state="$state" \
            -f context="plate/check" \
            -f description="downstream check and packaging: ${state}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          [ "$state" = "success" ]
