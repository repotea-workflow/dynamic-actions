name: "[pubox] Check"

on:
  push:
    branches: [0xfe10/pubox]

permissions:
  contents: read

concurrency:
  group: pubox-check-${{ github.sha }}
  cancel-in-progress: true

jobs:
  rust:
    name: Validate Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out immutable pubox source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: 0xfe10/pubox
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Build CLI binaries
        run: cargo build --locked --bins
