name: "[gprinter] Check"

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

env:
  PLATE_ALLOWED_PARENT_ORIGIN: https://gprinter-stg.taiok.life
  PLATE_EDITOR_HOST_PATH: apps/admin/public/plate-editor
  PLATE_REF: 7f1978f516dc4e3a3512eb3584ba9f98c1077d82
  PLATE_REPOSITORY: boxliy/plate

jobs:
  dashboard:
    name: Dashboard check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/gprinter
          token: ${{ secrets.GH_TOKEN_0XFE10 }}

      - name: Checkout Plate editor host
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PLATE_REPOSITORY }}
          ref: ${{ env.PLATE_REF }}
          path: vendor/plate
          persist-credentials: false
          token: ${{ secrets.GH_TOKEN_0X128BIT }}

      # pnpm/action-setup v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.2
          run_install: false

      # actions/setup-node v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      # taiki-e/install-action just
      - uses: taiki-e/install-action@782607f383d1c9d72a26177e2594cd8dad0f3840

      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Build Gprinter Plate editor host
        working-directory: apps/plate_editor_host
        run: |
          printf 'dependency_overrides:\n  plate_editor_support:\n    path: ../../vendor/plate/packages/plate_editor_support\n' > pubspec_overrides.yaml
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build web \
            --no-pub \
            --release \
            --base-href /plate-editor/ \
            --dart-define=PLATE_ALLOWED_PARENT_ORIGIN=${PLATE_ALLOWED_PARENT_ORIGIN}

      - name: Install Plate editor host into admin static assets
        run: |
          mkdir -p "${PLATE_EDITOR_HOST_PATH}"
          cp -R apps/plate_editor_host/build/web/. "${PLATE_EDITOR_HOST_PATH}/"

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dashboard
        run: just check-dashboard

  backend:
    name: Backend check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/gprinter
          token: ${{ secrets.GH_TOKEN_0XFE10 }}

      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: clippy,rustfmt

      # taiki-e/install-action just
      - uses: taiki-e/install-action@782607f383d1c9d72a26177e2594cd8dad0f3840

      - name: Install backend dependencies
        run: cargo fetch --locked

      - name: Verify backend
        run: just check-backend

  app:
    name: App check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/gprinter
          token: ${{ secrets.GH_TOKEN_0XFE10 }}

      # taiki-e/install-action just
      - uses: taiki-e/install-action@782607f383d1c9d72a26177e2594cd8dad0f3840

      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Flutter SDK
        run: fvm install

      - name: Configure private GitHub dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0X128BIT }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install app dependencies
        run: fvm flutter pub get

      - name: Format app
        run: fvm dart format --set-exit-if-changed apps/mobile packages/mobile-api

      - name: Analyze app
        run: |
          fvm flutter analyze apps/mobile
          fvm dart analyze packages/mobile-api

      - name: Test app
        run: just test-mobile

      # This key is for CI validation, not a final app-store release identity.
      - name: Configure Android CI release signing
        env:
          SIGNING_JSON: ${{ secrets.GPRINTER_CI_RELEASE_SIGNING_JSON }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["SIGNING_JSON"])
          keystore = Path(os.environ["RUNNER_TEMP"]) / "gprinter-ci-release.p12"
          properties = Path("apps/mobile/android/key.properties")

          def write_private(path, content):
              with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), "wb") as output:
                  output.write(content)

          def property_value(value):
              return (value.replace("\\", "\\\\").replace("\r", "\\r")
                      .replace("\n", "\\n").replace("\t", "\\t")
                      .replace(" ", "\\ "))

          values = {
              "storeFile": str(keystore.resolve()),
              "storePassword": payload["storePassword"],
              "keyAlias": payload["keyAlias"],
              "keyPassword": payload["keyPassword"],
          }
          if not all(isinstance(value, str) and value for value in values.values()):
              raise SystemExit("CI signing properties must be nonempty strings")
          write_private(keystore, base64.b64decode(payload["keystoreBase64"], validate=True))
          write_private(properties, "".join(
              f"{key}={property_value(value)}\n" for key, value in values.items()
          ).encode("ascii"))
          PY

      - name: Build Android release APK
        working-directory: apps/mobile
        run: fvm flutter build apk --release --no-pub

      - name: Remove Android CI release signing
        if: always()
        run: rm -f apps/mobile/android/key.properties "$RUNNER_TEMP/gprinter-ci-release.p12"

      - name: Remove private GitHub dependency credentials
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0X128BIT }}
        run: git config --global --unset-all url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf || true

  ios:
    name: iOS release check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/gprinter
          token: ${{ secrets.GH_TOKEN_0XFE10 }}

      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Flutter SDK
        run: fvm install

      - name: Configure private GitHub dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0X128BIT }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install app dependencies
        run: fvm flutter pub get

      - name: Build unsigned iOS release
        working-directory: apps/mobile
        run: fvm flutter build ios --release --no-codesign --no-pub

      - name: Remove private GitHub dependency credentials
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0X128BIT }}
        run: git config --global --unset-all url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf || true
