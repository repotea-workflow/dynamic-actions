name: "[pxlab] Check"

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  check-linux:
    name: Check Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Dart
            command: check-dart
          - name: Java
            command: check-java
          - name: Rust
            command: check-rust
          - name: TypeScript
            command: check-ts
    steps:
      - uses: actions/checkout@v6
      - uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/pxlab
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt
      - if: matrix.name == 'Dart'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - if: matrix.name == 'Java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.name == 'Rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - if: matrix.name == 'TypeScript'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: extractions/setup-just@v4
      - run: just ${{ matrix.command }}

  check-macos:
    name: Check macOS (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Swift
            command: check-swift
          - name: Objective-C
            command: check-objc
    steps:
      - uses: actions/checkout@v6
      - uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/pxlab
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt
      - uses: extractions/setup-just@v4
      - run: just ${{ matrix.command }}
