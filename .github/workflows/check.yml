name: "[codeoo] Check"

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@e265ebca9b4a93aaf804be57c2687554dcc49dc7
        with:
          repository: fewensa/codeoo
          token: "${{ secrets.GH_TOKEN_FEWENSA }}"
          ref_file: .github/ref.txt

      - name: Verify source revision
        run: |
          expected="$(cat __origin__/.github/commit.txt)"
          actual="$(git rev-parse --short=7 HEAD)"
          test "$actual" = "$expected"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy

      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0

      - name: Install pinned Console dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          test "$(node --version)" = "v26.7.0"
          test "$(pnpm --version)" = "10.33.2"
          pnpm --dir codeon/console install --frozen-lockfile --ignore-scripts

      - name: Verify Console contract and build
        run: |
          pnpm --dir codeon/console check:openapi
          pnpm --dir codeon/console typecheck
          pnpm --dir codeon/console test
          pnpm --dir codeon/console build

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install Codex
        run: |
          npm install --global "@openai/codex@0.144.6"
          test "$(codex --version)" = "codex-cli 0.144.6"

      - name: Run tests
        timeout-minutes: 120
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace --locked

      - name: Run release-mode Console browser smoke
        run: |
          google-chrome --version
          cargo test --release -p codeon daemon::api::tests::browser_loads_console_deep_link -- --ignored --exact --nocapture

  image-builder:
    name: Image builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@e265ebca9b4a93aaf804be57c2687554dcc49dc7
        with:
          repository: fewensa/codeoo
          token: "${{ secrets.GH_TOKEN_FEWENSA }}"
          ref_file: .github/ref.txt

      - name: Verify source revision
        run: |
          expected="$(cat __origin__/.github/commit.txt)"
          actual="$(git rev-parse --short=7 HEAD)"
          test "$actual" = "$expected"

      - name: Build final image
        run: docker build --tag codeoo:runtime-check .

      - name: Verify final image binaries need no Node invocation
        run: |
          docker run --rm --entrypoint sh codeoo:runtime-check \
            -c 'test -x /usr/local/bin/codeoff && test -x /usr/local/bin/codeon && PATH=/nonexistent /usr/local/bin/codeon --version'
