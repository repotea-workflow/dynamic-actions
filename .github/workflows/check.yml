name: "[plate] Check"

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  # Every dynamic-branch push is a distinct trigger commit carrying its own
  # source metadata (.github/branch.txt, commit.txt, ref.txt). Keying the
  # group by the trigger SHA instead of the shared dynamic branch prevents a
  # later source-branch push (for example pr-10 while pr-09 is running) from
  # cancelling this run or sharing ref.txt state with it, so each run checks
  # out exactly the source commit that triggered it.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read source metadata
        id: source
        run: |
          set -euo pipefail
          echo "source_branch=$(cat .github/branch.txt)" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(cat .github/commit.txt)" >> "$GITHUB_OUTPUT"
          echo "source_repository=$(cat .github/repository.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/plate
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Verify checked-out source matches this trigger
        id: verify
        run: |
          set -euo pipefail
          actual="$(git rev-parse --short=7 HEAD)"
          expected="${{ steps.source.outputs.source_commit }}"
          branch="${{ steps.source.outputs.source_branch }}"
          if [ "$actual" != "$expected" ]; then
            echo "dynamic-branch race: checked out ${actual} but this trigger recorded ${expected} (${branch}); retry after the stack is quiet" >&2
            exit 1
          fi
          echo "checked out ${branch} at ${actual}"
          # The status API requires the full object id, while commit.txt
          # records the short form for human-readable verification.
          echo "source_commit_full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # The workspace pins Flutter via .fvmrc; the baseline goldens are
          # rasterized with that SDK, so the CI run must use the same version
          # instead of the latest stable channel.
          flutter-version-file: .fvmrc

      - name: Map installed Flutter to melos SDK path
        run: |
          mkdir -p .fvm
          ln -s "$FLUTTER_ROOT" .fvm/flutter_sdk

      - name: Install melos
        run: dart pub global activate melos 2.9.0

      - name: Add pub cache bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Run checks
        run: just check

      - name: Report downstream conclusion to the source commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0X128BIT }}
        run: |
          set -euo pipefail
          case "${{ job.status }}" in
            success) state="success" ;;
            cancelled) state="error" ;;
            *) state="failure" ;;
          esac
          gh api \
            --method POST \
            "repos/${{ steps.source.outputs.source_repository }}/statuses/${{ steps.verify.outputs.source_commit_full }}" \
            -f state="$state" \
            -f context="plate/check" \
            -f description="downstream just check: ${{ job.status }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
