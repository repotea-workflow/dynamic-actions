name: "[aviary] Check"

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  source:
    name: Resolve exact source revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - id: source
        uses: repotea-workspace/kangumi/github-actions/dyn-source@6342e5b00d730c134699b734cdb100988af58ee0
        with:
          repository: boxliy/aviary
          token: ${{ secrets.GH_TOKEN_0X128BIT }}

  check:
    needs: source
    name: Check repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@6342e5b00d730c134699b734cdb100988af58ee0
        with:
          repository: boxliy/aviary
          token: ${{ secrets.GH_TOKEN_0X128BIT }}
          ref: ${{ needs.source.outputs.sha }}

      # taiki-e/install-action just
      - uses: taiki-e/install-action@782607f383d1c9d72a26177e2594cd8dad0f3840

      - name: Configure Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      # pnpm/action-setup v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.2
          run_install: false

      # actions/setup-node v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: songbirds/pnpm-lock.yaml

      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.4
          channel: stable

      - name: Configure FVM command
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nif [ "$1" = exec ]; then\n  shift\n  PATH="$FLUTTER_ROOT/bin:$FLUTTER_ROOT/bin/cache/dart-sdk/bin:$PATH"\n  export PATH\n  exec "$@"\nfi\ncommand="$1"\nshift\nexec "$FLUTTER_ROOT/bin/$command" "$@"\n' > "$RUNNER_TEMP/bin/fvm"
          chmod +x "$RUNNER_TEMP/bin/fvm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Resolve Flutter dependencies
        working-directory: waterfowl
        env:
          AVIARY_DEPENDENCY_GH_TOKEN: ${{ secrets.GH_TOKEN_0X128BIT }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.https://github.com.useHttpPath
          GIT_CONFIG_VALUE_0: "true"
          GIT_CONFIG_KEY_1: credential.https://github.com/boxliy/nib.git.helper
          GIT_CONFIG_VALUE_1: '!f() { test "$1" = get && printf "username=x-access-token\npassword=%s\n" "$AVIARY_DEPENDENCY_GH_TOKEN"; }; f'
        run: fvm dart pub get

      - name: Install dependencies
        run: |
          cd waterfowl
          fvm dart run melos bootstrap
          # This runner is deliberately outside the Flutter pub workspace.
          (cd tools/stac_cli && fvm dart pub get --enforce-lockfile)
          cd ..
          pnpm --dir songbirds install --frozen-lockfile
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit --file raptors/Cargo.lock

      - name: Verify repository
        run: |
          trap 'just db-down' EXIT
          just -f waterfowl/Justfile build-feature-styles
          just -f waterfowl/Justfile test
          just check
          pnpm --dir songbirds lint
          pnpm --dir songbirds test
          pnpm --dir songbirds build
          just -f waterfowl/Justfile format-check
          just db-up
          just migrate
          just test-db
          just smoke-backend

      - name: Verify real Alibaba OSS acceptance
        env:
          AVIARY_OSS_E2E_ACCESS_KEY_ID: ${{ secrets.AVIARY_OSS_E2E_ACCESS_KEY_ID }}
          AVIARY_OSS_E2E_ACCESS_KEY_SECRET: ${{ secrets.AVIARY_OSS_E2E_ACCESS_KEY_SECRET }}
          AVIARY_OSS_E2E_SECURITY_TOKEN: ${{ secrets.AVIARY_OSS_E2E_SECURITY_TOKEN }}
          AVIARY_OSS_E2E_BUCKET: ${{ secrets.AVIARY_OSS_E2E_BUCKET }}
          AVIARY_OSS_E2E_REGION: ${{ secrets.AVIARY_OSS_E2E_REGION }}
          AVIARY_OSS_E2E_CUSTOM_ENDPOINT: ${{ secrets.AVIARY_OSS_E2E_CUSTOM_ENDPOINT }}
          AVIARY_OSS_E2E_PREFIX: ${{ secrets.AVIARY_OSS_E2E_PREFIX }}
        run: |
          trap 'just db-down' EXIT
          just db-up
          just e2e-oss
