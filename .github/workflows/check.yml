name: "[aviary] Check"

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  check:
    name: Check repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/aviary
          token: ${{ secrets.GH_TOKEN_0X128BIT }}
          ref_file: .github/ref.txt

      # taiki-e/install-action just
      - uses: taiki-e/install-action@782607f383d1c9d72a26177e2594cd8dad0f3840

      # pnpm/action-setup v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.2
          run_install: false

      # actions/setup-node v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: songbirds/pnpm-lock.yaml

      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Configure FVM command
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\ncommand="$1"\nshift\nexec "$FLUTTER_ROOT/bin/$command" "$@"\n' > "$RUNNER_TEMP/bin/fvm"
          chmod +x "$RUNNER_TEMP/bin/fvm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          cd waterfowl/swan && fvm dart pub get && fvm dart run melos bootstrap
          cd ../..
          pnpm --dir songbirds install --frozen-lockfile

      - name: Verify repository
        run: |
          trap 'just db-down' EXIT
          just -f waterfowl/swan/Justfile test
          just check
          pnpm --dir songbirds lint
          pnpm --dir songbirds test
          pnpm --dir songbirds build
          just -f waterfowl/swan/Justfile format-check
          just db-up
          just migrate
          just test-db
          just smoke-backend
