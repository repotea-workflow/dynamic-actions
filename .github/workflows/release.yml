name: "[pubox] Release"

on:
  push:
    tags: ['v*-pubox']

permissions:
  contents: read

concurrency:
  group: pubox-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: repotea-workspace/kangumi/github-actions/dyn-source@main
        id: source
        with:
          repository: 0xfe10/pubox
          tags: 'v*'
      - name: Require a source tag
        env:
          MATCHES: ${{ steps.source.outputs.matches }}
        run: test "$MATCHES" = true
      - uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: 0xfe10/pubox
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref: ${{ steps.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: pubox-linux-amd64.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: pubox-linux-arm64.tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: pubox-darwin-arm64.tar.gz
          - runner: macos-14
            target: x86_64-apple-darwin
            archive: pubox-darwin-amd64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: 0xfe10/pubox
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref: ${{ needs.verify.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" -p pubox-cli
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.archive }}" pubox
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pubox-*
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS and publish release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0XFE10 }}
          SOURCE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          cd dist
          sha256sum pubox-*.tar.gz > SHA256SUMS
          if gh release view "${SOURCE_TAG}" --repo 0xfe10/pubox >/dev/null 2>&1; then
            gh release upload "${SOURCE_TAG}" --repo 0xfe10/pubox --clobber pubox-*.tar.gz SHA256SUMS
          else
            gh release create "${SOURCE_TAG}" --repo 0xfe10/pubox --target "${SOURCE_SHA}" --generate-notes pubox-*.tar.gz SHA256SUMS
          fi
