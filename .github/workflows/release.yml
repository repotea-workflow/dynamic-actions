name: "[pubox] Release"

on:
  push:
    tags: ['v*-pubox']

permissions:
  contents: read
  packages: write

concurrency:
  group: pubox-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: repotea-workspace/kangumi/github-actions/dyn-source@main
        id: source
        with:
          repository: 0xfe10/pubox
          tags: 'v*'
      - name: Require a source tag
        env:
          MATCHES: ${{ steps.source.outputs.matches }}
        run: test "$MATCHES" = true
      - uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: 0xfe10/pubox
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref: ${{ steps.source.outputs.sha }}
      - name: Validate source tag identity
        env:
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/release.py identity
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/dashboard/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm --dir web/dashboard install --frozen-lockfile
      - name: Typecheck dashboard
        run: pnpm --dir web/dashboard typecheck
      - name: Test dashboard
        run: pnpm --dir web/dashboard test
      - name: Build dashboard
        run: pnpm --dir web/dashboard build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-dist
          path: web/dashboard/dist
          if-no-files-found: error
          retention-days: 3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: verify
    name: Build ${{ matrix.archive }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            musl: false
            target: x86_64-unknown-linux-gnu
            archive: pubox-linux-amd64.tar.gz
          - runner: ubuntu-latest
            os: linux
            musl: true
            target: x86_64-unknown-linux-musl
            archive: pubox-linux-amd64-musl.tar.gz
          - runner: ubuntu-24.04-arm
            os: linux
            musl: false
            target: aarch64-unknown-linux-gnu
            archive: pubox-linux-arm64.tar.gz
          - runner: ubuntu-24.04-arm
            os: linux
            musl: true
            target: aarch64-unknown-linux-musl
            archive: pubox-linux-arm64-musl.tar.gz
          - runner: macos-15
            os: darwin
            musl: false
            target: aarch64-apple-darwin
            archive: pubox-darwin-arm64.tar.gz
          - runner: macos-15
            os: darwin
            musl: false
            target: x86_64-apple-darwin
            archive: pubox-darwin-amd64.tar.gz
          - runner: windows-latest
            os: windows
            musl: false
            target: x86_64-pc-windows-msvc
            archive: pubox-windows-amd64.zip
          - runner: windows-latest
            os: windows
            musl: false
            target: aarch64-pc-windows-msvc
            archive: pubox-windows-arm64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - if: matrix.os != 'windows'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: matrix.os != 'windows'
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: 0xfe10/pubox
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref: ${{ needs.verify.outputs.sha }}
      - name: Check out immutable pubox source on Windows
        if: matrix.os == 'windows'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: 0xfe10/pubox
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
      - name: Download dashboard bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-dist
          path: web/dashboard/dist
      - name: Install musl toolchain
        if: matrix.musl
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          arch=$(uname -m)
          if ! command -v "${arch}-linux-musl-gcc" >/dev/null 2>&1; then
            sudo ln -s /usr/bin/musl-gcc "/usr/local/bin/${arch}-linux-musl-gcc"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Package release binary
        shell: bash
        env:
          SOURCE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          RUST_TARGET: ${{ matrix.target }}
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          if python3 -c "import sys" >/dev/null 2>&1; then
            PY=python3
          else
            PY=python
          fi
          "$PY" scripts/release.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out immutable pubox source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        id: checkout
        with:
          repository: 0xfe10/pubox
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref: ${{ needs.verify.outputs.sha }}
          source_context: "true"
          image_name: pubox
          acr_namespace: coohub
          acr_registry: crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com
      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: "0xfe10"
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ghcr.io
      - name: Docker login (Aliyun ACR)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: Dockerfile
          provenance: mode=min
          sbom: false
          platforms: linux/amd64
          tags: |
            ${{ steps.checkout.outputs.ghcr_tags }}
            ghcr.io/0xfe10/pubox:${{ needs.verify.outputs.tag }}
            ghcr.io/0xfe10/pubox:latest
          labels: ${{ steps.checkout.outputs.oci_labels }}
          annotations: index:org.opencontainers.image.source=${{ steps.checkout.outputs.oci_source }}
      - name: Mirror image to Aliyun ACR
        uses: nick-fields/retry@v3
        env:
          SOURCE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            set -euo pipefail
            image="${{ steps.checkout.outputs.ghcr_sha }}"
            primary_acr_image="crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com/coohub/pubox"
            metadata_acr_image="${{ steps.checkout.outputs.ali_image }}"
            short_sha="${SOURCE_SHA:0:7}"
            docker pull "$image"
            for acr_image in "$primary_acr_image" "$metadata_acr_image"; do
              for tag in "$SOURCE_TAG" "sha-$short_sha" latest; do
                target="$acr_image:$tag"
                docker tag "$image" "$target"
                docker push --platform linux/amd64 "$target"
              done
            done
            docker pull "$primary_acr_image:$SOURCE_TAG"
            digest=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$primary_acr_image:$SOURCE_TAG" | sed -n "\|^$primary_acr_image@|p" | head -n 1)
            test -n "$digest"
            echo "Aliyun ACR: $digest" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: 0xfe10/pubox
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pubox-*
          path: dist
          merge-multiple: true
      - name: Verify archives and generate SHA256SUMS
        env:
          SOURCE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          python3 scripts/release.py identity
          python3 scripts/release.py checksums
      - name: Publish release assets to 0xfe10/pubox
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0XFE10 }}
          SOURCE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: bash scripts/publish-release.sh
