name: '[weauto] Checks'
permissions:
  contents: read
jobs:
  source:
    name: Resolve exact source revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      branch: ${{ steps.source.outputs.branch }}
    steps:
    - uses: actions/checkout@v4
    - id: source
      uses: repotea-workspace/kangumi/github-actions/dyn-source@b3d7f5fc3ec2c003cf061349d52f8c741da754db
      with:
        repository: 0xfe10/weauto
        token: ${{ secrets.GH_TOKEN_0XFE10 }}
  rust:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Check out immutable WeAuto source
      uses: repotea-workspace/kangumi/github-actions/clone-dyn@b3d7f5fc3ec2c003cf061349d52f8c741da754db
      with:
        repository: 0xfe10/weauto
        token: ${{ secrets.GH_TOKEN_0XFE10 }}
        ref: ${{ needs.source.outputs.sha }}
    - uses: dtolnay/rust-toolchain@1.93.1
      with:
        components: rustfmt, clippy
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install media test prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg python3-yaml
    - name: Verify media test prerequisites
      run: |
        ffmpeg -version
        ffprobe -version
    - uses: Swatinem/rust-cache@v2
    - run: cargo fmt --all -- --check
    - run: cargo check --workspace --locked
    - run: node clients/sdk/generate.mjs --check
    - run: cargo test --workspace --locked
    - run: cargo build --locked --bins
    - run: python3 -m unittest discover -s tests/processes -v
    - run: python3 -m unittest discover -s tests/desktop -v
    - run: node --test tests/desktop/*.test.cjs
  sdk:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Check out immutable WeAuto source
      uses: repotea-workspace/kangumi/github-actions/clone-dyn@b3d7f5fc3ec2c003cf061349d52f8c741da754db
      with:
        repository: 0xfe10/weauto
        token: ${{ secrets.GH_TOKEN_0XFE10 }}
        ref: ${{ needs.source.outputs.sha }}
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile --ignore-scripts
    - run: pnpm build
    - run: pnpm typecheck
    - run: pnpm test
'on':
  push:
    branches: [0xfe10/weauto]
concurrency:
  group: weauto-checks-${{ github.sha }}
  cancel-in-progress: true
