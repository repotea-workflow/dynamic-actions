name: "[concord] External Workbot services"

on:
  push:
    branches: ["**"]

concurrency:
  group: workbot-external-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [bridge, tools]
    steps:
      - uses: actions/checkout@v7
      - name: Read source metadata
        id: source
        run: |
          echo "sha=$(cut -c1-7 .github/commit.txt)" >> "$GITHUB_OUTPUT"
          if grep -qx main .github/branch.txt; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out Concord source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: 0xfe10/concord
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref_file: .github/ref.txt
      - name: Test component
        env:
          COMPONENT: ${{ matrix.component }}
        run: PYTHONPATH="integrations/$COMPONENT" python3 -m unittest discover -s "integrations/$COMPONENT" -v
      - uses: docker/setup-buildx-action@v4
      - name: Build candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.component }}/Dockerfile
          load: true
          tags: workbot-${{ matrix.component }}:candidate
          cache-from: type=gha,scope=workbot-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=workbot-${{ matrix.component }}
      - name: Verify candidate runtime
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          docker run --rm --network none --entrypoint python \
            -v "$PWD/integrations/$COMPONENT:/tests:ro" -e PYTHONPATH=/tests \
            "workbot-$COMPONENT:candidate" -m unittest discover -s /tests -v
      - uses: docker/login-action@v4
        if: steps.source.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish external service only
        if: steps.source.outputs.publish == 'true'
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          image="ghcr.io/repotea-workflow/dynamic-actions/workbot-$COMPONENT:sha-$SOURCE_SHA"
          docker tag "workbot-$COMPONENT:candidate" "$image"
          docker push "$image"
