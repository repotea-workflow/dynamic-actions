name: "[workbot] Workbot portal image"

on:
  push:
    branches: ["**"]
    tags: ["v*-workbot"]

concurrency:
  group: workbot-portal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/0xfe10/workbot/workbot-portal

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read source metadata
        id: source
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0XFE10 }}
        run: |
          test "$(cat .github/repository.txt)" = "0xfe10/workbot"
          source_ref=$(cat .github/commit.txt)
          revision=$(gh api "repos/0xfe10/workbot/commits/$source_ref" --jq .sha)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "sha=${revision:0:7}" >> "$GITHUB_OUTPUT"
          echo "repository=0xfe10/workbot" >> "$GITHUB_OUTPUT"
          if grep -qx main .github/branch.txt; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            source_tag=$(cat .github/tag.txt)
            [[ "$source_tag" =~ ^v[A-Za-z0-9_.-]{0,127}$ ]]
            test "$GITHUB_REF_NAME" = "${source_tag}-workbot"
            tag_revision=$(gh api "repos/0xfe10/workbot/commits/$source_tag" --jq .sha)
            test "$tag_revision" = "$revision"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out Workbot source
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: ${{ steps.source.outputs.repository }}
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref: ${{ steps.source.outputs.revision }}
          source_context: "true"
          image_name: workbot-portal
      - name: Test authentication and directory isolation
        run: python3 -m unittest discover -s integrations/workbot -v
      - uses: docker/setup-buildx-action@v4
      - name: Build candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/workbot/Dockerfile
          load: true
          labels: ${{ steps.checkout.outputs.oci_labels }}
          tags: workbot-portal:candidate
      - name: Verify candidate runtime
        run: |
          docker run --rm --entrypoint python -v "$PWD/integrations/workbot:/tests:ro" -w /tests \
            workbot-portal:candidate -m unittest -v test_auth_handoff test_portal
      - uses: docker/login-action@v4
        if: steps.source.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: 0xfe10
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
      - name: Publish verified image
        if: steps.source.outputs.publish == 'true'
        env:
          GHCR_TAGS: ${{ steps.checkout.outputs.ghcr_tags }}
        run: |
          while IFS= read -r image; do
            test -n "$image" || continue
            docker tag workbot-portal:candidate "$image"
            docker push "$image"
          done <<< "$GHCR_TAGS"
