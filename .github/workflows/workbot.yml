name: "[workbot] Workbot portal image"

on:
  push:
    branches: ["**"]

concurrency:
  group: workbot-portal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/repotea-workflow/dynamic-actions/workbot-portal

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read source metadata
        id: source
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0XFE10 }}
        run: |
          test "$(cat .github/repository.txt)" = "0xfe10/workbot"
          source_ref=$(cat .github/commit.txt)
          revision=$(gh api "repos/0xfe10/workbot/commits/$source_ref" --jq .sha)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "sha=${revision:0:7}" >> "$GITHUB_OUTPUT"
          echo "repository=0xfe10/workbot" >> "$GITHUB_OUTPUT"
          if grep -qx main .github/branch.txt; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out Workbot source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: ${{ steps.source.outputs.repository }}
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref: ${{ steps.source.outputs.revision }}
      - name: Test authentication and directory isolation
        run: python3 -m unittest discover -s integrations/workbot -v
      - uses: docker/setup-buildx-action@v4
      - name: Build candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/workbot/Dockerfile
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/0xfe10/workbot
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          tags: workbot-portal:candidate
      - name: Verify candidate runtime
        run: |
          docker run --rm --entrypoint python -v "$PWD/integrations/workbot:/tests:ro" \
            workbot-portal:candidate -m unittest discover -s /tests -v
      - uses: docker/login-action@v4
        if: steps.source.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: steps.source.outputs.publish == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          docker tag workbot-portal:candidate "${IMAGE_NAME}:sha-${SOURCE_SHA}"
          docker push "${IMAGE_NAME}:sha-${SOURCE_SHA}"
