name: "[aviary] Android Checks"

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  source:
    name: Resolve exact source revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - id: source
        uses: repotea-workspace/kangumi/github-actions/dyn-source@main
        with:
          repository: boxliy/aviary
          token: ${{ secrets.GH_TOKEN_0X128BIT }}

  android:
    needs: source
    name: Android Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/aviary
          token: ${{ secrets.GH_TOKEN_0X128BIT }}
          ref: ${{ needs.source.outputs.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.4
          channel: stable
      - name: Resolve locked dependencies
        working-directory: waterfowl
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0X128BIT }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: "!gh auth git-credential"
        run: dart tool/develop.dart bootstrap
      - name: Pull Git LFS (Swan assets)
        run: |
          git lfs install
          git lfs pull
      - name: Verify local Swan resources
        working-directory: waterfowl
        run: dart run tools/swan_build/bin/verify_local_resources.dart --repo ..
      - name: Check Dart formatting
        working-directory: waterfowl
        run: dart tool/develop.dart format-check
      - name: Analyze Flutter workspace
        working-directory: waterfowl
        run: dart tool/develop.dart analyze
      - name: Run Flutter tests
        working-directory: waterfowl
        run: dart tool/develop.dart test
      - name: Build Android APK
        working-directory: waterfowl/apps/swan
        run: flutter build apk --debug --no-pub

