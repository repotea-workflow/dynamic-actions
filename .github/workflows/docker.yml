name: '[weauto] Docker image'
concurrency:
  group: weauto-docker-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  source:
    name: Resolve exact source revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      branch: ${{ steps.source.outputs.branch }}
      build: ${{ steps.build.outputs.build }}
    steps:
    - uses: actions/checkout@v4
    - id: source
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN_0XFE10 }}
      shell: bash
      run: |-
        set -euo pipefail
        test "$(cat .github/repository.txt)" = "0xfe10/weauto"
        source_ref="$(cat .github/commit.txt)"
        [[ "$source_ref" =~ ^[0-9a-f]{7,40}$ ]]
        source_sha="$(gh api "repos/0xfe10/weauto/commits/$source_ref" --jq .sha)"
        [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
        echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
        if [ -f .github/branch.txt ]; then
          echo "branch=$(cat .github/branch.txt)" >> "$GITHUB_OUTPUT"
        fi
    - id: build
      env:
        BUILD_VERSION: ${{ env.WEAUTO_BUILD_VERSION }}
      run: |-
        set -euo pipefail
        if [ -n "$BUILD_VERSION" ]; then
         [[ "$BUILD_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
         echo "build=true" >> "$GITHUB_OUTPUT"
        else
         echo "build=false" >> "$GITHUB_OUTPUT"
        fi
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
        - runner: ubuntu-latest
          arch: amd64
          platform: linux/amd64
        - runner: ubuntu-24.04-arm
          arch: arm64
          platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - name: Check out immutable WeAuto source
      uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
      with:
        repository: 0xfe10/weauto
        token: ${{ secrets.GH_TOKEN_0XFE10 }}
        ref: ${{ needs.source.outputs.sha }}
    - name: Prepare Docker context
      run: |
        rm -rf docker/agent-server-rust
        mkdir -p docker/agent-server-rust
        cp packages/agent-server-rust/Cargo.toml docker/agent-server-rust/
        [ -f packages/agent-server-rust/Cargo.lock ] && cp packages/agent-server-rust/Cargo.lock docker/agent-server-rust/
        cp -r packages/agent-server-rust/src docker/agent-server-rust/
        cp -r packages/agent-server-rust/migrations docker/agent-server-rust/
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: docker
        platforms: ${{ matrix.platform }}
        no-cache: ${{ env.WEAUTO_NO_CACHE == 'true' }}
        outputs: type=image,name=ghcr.io/repotea-workflow/dynamic-actions/weauto,push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,scope=${{ matrix.arch }},mode=max
    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        DIGEST="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${DIGEST#sha256:}"
    - uses: actions/upload-artifact@v4
      with:
        name: digest-${{ matrix.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1
    needs: source
    if: needs.source.outputs.build == 'true'
    timeout-minutes: 30
  manifest:
    name: Manifest
    needs:
    - source
    - build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digest-*
        merge-multiple: true
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Create multi-arch manifest
      run: |
        IMAGE="ghcr.io/repotea-workflow/dynamic-actions/weauto"
        docker buildx imagetools create \
          -t "${IMAGE}:${{ env.WEAUTO_BUILD_VERSION }}" \
          -t "${IMAGE}:latest" \
          $(printf "${IMAGE}@sha256:%s " $(ls /tmp/digests/))
    timeout-minutes: 30
'on':
  push:
    branches:
    - 0xfe10/weauto
env:
  WEAUTO_BUILD_VERSION: "sha-d93d48a"
  WEAUTO_NO_CACHE: "false"
  IMAGE_NAME: ghcr.io/repotea-workflow/dynamic-actions/weauto
