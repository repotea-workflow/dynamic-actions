name: "[webox] Docker image"

on:
  push:
    branches:
      - "**"
    tags:
      - "v*-webox"

concurrency:
  group: webox-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/repotea-workflow/dynamic-actions/webox
  WECHAT_DOWNLOAD_BASE: https://dldir1v6.qq.com/weixin/Universal/Linux

jobs:
  prepare:
    name: Prepare source metadata
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.source.outputs.publish }}
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read source metadata
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(cut -c1-7 .github/commit.txt)" >> "$GITHUB_OUTPUT"
          if [[ -f .github/tag.txt ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(cat .github/tag.txt)" >> "$GITHUB_OUTPUT"
          elif grep -qx main .github/branch.txt; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test Go agent
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check out source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: 0xfe10/webox
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref_file: .github/ref.txt

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.platform }}
    needs:
      - prepare
      - test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            wechat_package: WeChatLinux_x86_64.deb
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            wechat_package: WeChatLinux_arm64.deb
    steps:
      - uses: actions/checkout@v7

      - name: Check out source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: 0xfe10/webox
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref_file: .github/ref.txt

      - name: Download bundled WeChat package
        run: |
          set -euo pipefail
          package="${{ matrix.wechat_package }}"
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --output "docker/wechat/${package}" \
            "${WECHAT_DOWNLOAD_BASE}/${package}"
          dpkg-deb --info "docker/wechat/${package}" >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: ${{ needs.prepare.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_NAME) || '' }}
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=webox-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=webox-${{ matrix.arch }}
          provenance: ${{ needs.prepare.outputs.publish == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.prepare.outputs.publish == 'true' }}

      - name: Export image digest
        if: needs.prepare.outputs.publish == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-platform image
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifest
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          SOURCE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t digests < <(find /tmp/digests -type f -printf "${IMAGE_NAME}@sha256:%f\n" | sort)
          test "${#digests[@]}" -eq 2
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:sha-${SOURCE_SHA}" \
            --tag "${IMAGE_NAME}:${SOURCE_TAG}" \
            "${digests[@]}"

      - name: Inspect multi-platform image
        env:
          SOURCE_TAG: ${{ needs.prepare.outputs.tag }}
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${SOURCE_TAG}"
