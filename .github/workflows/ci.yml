name: "[agent-gateway] CI"

on:
  push:
    branches: ["0xfe10/agent-gateway"]
    tags: ["v*-agent-gateway"]

concurrency:
  group: agent-gateway-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      publish: ${{ steps.source.outputs.publish }}
      version: ${{ steps.source.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/gateway_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve source revision and publication target
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0XFE10 }}
        run: |
          set -euo pipefail
          repository=$(cat .github/repository.txt)
          [[ "$repository" == "0xfe10/agent-gateway" ]]
          ref=$(cat .github/commit.txt)
          [[ "$ref" =~ ^[0-9a-f]{7,40}$ ]]
          revision=$(gh api "repos/$repository/commits/$ref" --jq .sha)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

          publish=false
          version=
          if [[ "$GITHUB_REF" == refs/heads/0xfe10/agent-gateway && -f .github/branch.txt ]]; then
            if [[ "$(cat .github/branch.txt)" == main ]]; then
              publish=true
            fi
          elif [[ "$GITHUB_REF" == refs/tags/* && -f .github/tag.txt ]]; then
            tag=$(cat .github/tag.txt)
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF_NAME" == "${tag}-agent-gateway" ]]; then
              if tag_rev=$(gh api "repos/$repository/commits/$tag" --jq .sha) && [[ "$tag_rev" == "$revision" ]]; then
                publish=true
                version=$tag
              fi
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out gateway source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: 0xfe10/agent-gateway
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref: ${{ steps.source.outputs.revision }}
          source_context: "true"
          image_name: agent-gateway
          acr_registry: registry.cn-hongkong.aliyuncs.com
          acr_namespace: xoohub

      - &clear-credentials
        name: Remove and verify checkout credentials
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Checkout v7 stores the header in an included runner-temp config.
          for file in "$RUNNER_TEMP"/git-credentials-*.config; do
            unlink -- "$file"
          done
          repos=(.)
          if [[ -e __origin__/.git ]]; then repos+=(__origin__); fi
          for repo in "${repos[@]}"; do
            git -C "$repo" config --local --unset-all http.https://github.com/.extraheader || true
            keys=$(git -C "$repo" config --includes --name-only --list)
            if grep -Eiq '(^|\.)extraheader$' <<< "$keys"; then
              echo "::error::Git extraheader remains in $repo"
              exit 1
            fi
          done
          echo 'Checkout credentials removed. No effective Git extraheaders remain.'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration

      - uses: docker/setup-buildx-action@v4
      - name: Verify gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          github-token: ""

  publish:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out gateway source
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: 0xfe10/agent-gateway
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref: ${{ needs.verify.outputs.revision }}
          source_context: "true"
          image_name: agent-gateway
          acr_registry: registry.cn-hongkong.aliyuncs.com
          acr_namespace: xoohub

      - *clear-credentials
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: "0xfe10"
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hongkong.aliyuncs.com
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}

      - name: Select image tags
        id: image
        shell: bash
        env:
          GHCR_IMAGE: ${{ steps.checkout.outputs.ghcr_image }}
          ACR_IMAGE: ${{ steps.checkout.outputs.ali_image }}
          REVISION: ${{ needs.verify.outputs.revision }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          tags=("sha-${REVISION:0:7}")
          if [[ -n "$VERSION" ]]; then
            tags=("$VERSION" "${tags[@]}" latest)
          else
            tags+=(staging)
          fi
          {
            echo 'tags<<EOF'
            for image in "${GHCR_IMAGE:?}" "${ACR_IMAGE:?}"; do
              for tag in "${tags[@]}"; do
                echo "$image:$tag"
              done
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

  report-status:
    needs: [verify, publish]
    if: always() && needs.verify.outputs.revision != ''
    runs-on: ubuntu-slim
    steps:
      - name: Report source commit status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0XFE10 }}
          REVISION: ${{ needs.verify.outputs.revision }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "$VERIFY_RESULT" == success && ( "$PUBLISH_RESULT" == success || "$PUBLISH_RESULT" == skipped ) ]]; then
            state=success
          fi
          gh api --method POST "repos/0xfe10/agent-gateway/statuses/$REVISION" \
            -f "state=$state" \
            -f 'context=dynamic / [agent-gateway] CI' \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f "description=Gateway CI: $state" --silent
