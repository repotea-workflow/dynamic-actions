name: "[aviary] Admin Checks"

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  source:
    name: Resolve exact source revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - id: source
        uses: repotea-workspace/kangumi/github-actions/dyn-source@main
        with:
          repository: boxliy/aviary
          token: ${{ secrets.GH_TOKEN_0X128BIT }}

  admin:
    needs: source
    name: Admin Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/aviary
          token: ${{ secrets.GH_TOKEN_0X128BIT }}
          ref: ${{ needs.source.outputs.sha }}

      # pnpm/action-setup v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.2
          run_install: false

      # actions/setup-node v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: songbirds/pnpm-lock.yaml

      - name: Install admin dependencies
        run: pnpm --dir songbirds install --frozen-lockfile

      - name: Lint admin code
        run: pnpm --dir songbirds lint

      - name: Check admin types
        run: pnpm --dir songbirds typecheck

      - name: Run admin tests
        run: pnpm --dir songbirds test

      - name: Build admin application
        run: pnpm --dir songbirds build
