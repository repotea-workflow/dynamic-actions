name: "[ztoms] Production"

on:
  push:
    tags:
      - "v*-ztoms"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual production workflow mode"
        required: true
        default: "build-only"
        type: choice
        options:
          - "build-only"

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_UHUB: uhub.service.ucloud.cn

concurrency:
  group: ztoms-production-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-backend:
    name: Build v4 Java backend
    runs-on: ubuntu-latest
    outputs:
      ghcr_image: ${{ steps.tags.outputs.ghcr_sha }}
      uhub_image: ${{ steps.tags.outputs.uhub_sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/ztoms
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Set source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (UHub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_UHUB_USERNAME_ZTOKR }}
          password: ${{ secrets.CR_UHUB_PASSWORD_ZTOKR }}
          registry: ${{ env.DOCKER_REGISTRY_UHUB }}

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/ztoms-backend-v4:sha-${{ env.SOURCE_SHA }}" >> $GITHUB_OUTPUT
          echo "uhub_sha=${{ env.DOCKER_REGISTRY_UHUB }}/toohub/ztoms-backend-v4:sha-${{ env.SOURCE_SHA }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/omsk-v4-java.Dockerfile
          platforms: linux/amd64
          provenance: true
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.uhub_sha }}

  build-web:
    name: Build v4 web
    runs-on: ubuntu-latest
    outputs:
      ghcr_image: ${{ steps.tags.outputs.ghcr_sha }}
      uhub_image: ${{ steps.tags.outputs.uhub_sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/ztoms
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Set source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (UHub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_UHUB_USERNAME_ZTOKR }}
          password: ${{ secrets.CR_UHUB_PASSWORD_ZTOKR }}
          registry: ${{ env.DOCKER_REGISTRY_UHUB }}

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/ztoms-web-v4:sha-${{ env.SOURCE_SHA }}" >> $GITHUB_OUTPUT
          echo "uhub_sha=${{ env.DOCKER_REGISTRY_UHUB }}/toohub/ztoms-web-v4:sha-${{ env.SOURCE_SHA }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/omsk-control-web.Dockerfile
          platforms: linux/amd64
          provenance: true
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.uhub_sha }}

  build-omsj-api:
    name: Build OMSJ v4 Java backend
    runs-on: ubuntu-latest
    outputs:
      ghcr_image: ${{ steps.tags.outputs.ghcr_sha }}
      uhub_image: ${{ steps.tags.outputs.uhub_sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/ztoms
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Set source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (UHub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_UHUB_USERNAME_ZTOKR }}
          password: ${{ secrets.CR_UHUB_PASSWORD_ZTOKR }}
          registry: ${{ env.DOCKER_REGISTRY_UHUB }}

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/omsj-api-v4:sha-${{ env.SOURCE_SHA }}" >> $GITHUB_OUTPUT
          echo "uhub_sha=${{ env.DOCKER_REGISTRY_UHUB }}/toohub/omsj-api-v4:sha-${{ env.SOURCE_SHA }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/omsj-api-v4.Dockerfile
          platforms: linux/amd64
          provenance: true
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.uhub_sha }}

  build-omsj-web:
    name: Build OMSJ v4 web
    runs-on: ubuntu-latest
    outputs:
      ghcr_image: ${{ steps.tags.outputs.ghcr_sha }}
      uhub_image: ${{ steps.tags.outputs.uhub_sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/ztoms
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Set source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (UHub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_UHUB_USERNAME_ZTOKR }}
          password: ${{ secrets.CR_UHUB_PASSWORD_ZTOKR }}
          registry: ${{ env.DOCKER_REGISTRY_UHUB }}

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/omsj-web-v4:sha-${{ env.SOURCE_SHA }}" >> $GITHUB_OUTPUT
          echo "uhub_sha=${{ env.DOCKER_REGISTRY_UHUB }}/toohub/omsj-web-v4:sha-${{ env.SOURCE_SHA }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/omsj-web-v4.Dockerfile
          platforms: linux/amd64
          provenance: true
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.uhub_sha }}

  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build-backend
      - build-web
      - build-omsj-api
      - build-omsj-web
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/ztoms
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Set source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-fes
          deploy_key: "${{ secrets.DEPLOY_KEY_GITOPS_FES }}"
          argocd_server: ${{ secrets.ARGOCD_FES_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_FES_API_TOKEN }}
          app_name: work-production-ztoms-ula
          changes: |
            {
              "argocd/work/ztoms-ula/overlays/production/ztoms/values.yaml": {
                "ztomsV4.images.backend": "${{ needs.build-backend.outputs.uhub_image }}",
                "ztomsV4.images.web": "${{ needs.build-web.outputs.uhub_image }}",
                "ztomsV4.images.omsjApi": "${{ needs.build-omsj-api.outputs.uhub_image }}",
                "ztomsV4.images.omsjWeb": "${{ needs.build-omsj-web.outputs.uhub_image }}",
                "ztomsV4.migration.image": "${{ needs.build-backend.outputs.uhub_image }}"
              }
            }

      - name: Production smoke
        run: |
          curl --fail --show-error --silent --max-time 20 https://omsk-cusco.ztokr.com/ >/dev/null
          curl --fail --show-error --silent --max-time 20 https://omsk-roman.ztokr.com/ >/dev/null
          curl --fail --show-error --silent --max-time 20 https://omsk-api.ztokr.com/ >/dev/null
          curl --fail --show-error --silent --max-time 20 https://omsj.ztokr.com/ >/dev/null
          curl --fail --show-error --silent --max-time 20 https://omsj-api.ztokr.com/ >/dev/null
