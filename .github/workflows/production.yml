name: "[ztoms] Production"

on:
  push:
    tags:
      - "v*-ztoms"
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_UHUB: uhub.service.ucloud.cn

concurrency:
  group: ztoms-production-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-backend:
    name: "[omsk] Build Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/ztoms
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: ztoms-backend-v4

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (UHub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_UHUB_USERNAME_ZTOKR }}
          password: ${{ secrets.CR_UHUB_PASSWORD_ZTOKR }}
          registry: ${{ env.DOCKER_REGISTRY_UHUB }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/omsk-v4-java.Dockerfile
          platforms: linux/amd64
          provenance: mode=min
          sbom: false
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}
          annotations: index:org.opencontainers.image.source=${{ steps.checkout.outputs.oci_source }}

      - name: Push to UHub (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker pull ${{ steps.checkout.outputs.ghcr_sha }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ env.DOCKER_REGISTRY_UHUB }}/toohub/ztoms-backend-v4:${{ env.SOURCE_TAG }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ env.DOCKER_REGISTRY_UHUB }}/toohub/ztoms-backend-v4:sha-${{ env.SHORT_SHA }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ env.DOCKER_REGISTRY_UHUB }}/toohub/ztoms-backend-v4:latest
            docker push ${{ env.DOCKER_REGISTRY_UHUB }}/toohub/ztoms-backend-v4:${{ env.SOURCE_TAG }}
            docker push ${{ env.DOCKER_REGISTRY_UHUB }}/toohub/ztoms-backend-v4:sha-${{ env.SHORT_SHA }}
            docker push ${{ env.DOCKER_REGISTRY_UHUB }}/toohub/ztoms-backend-v4:latest

