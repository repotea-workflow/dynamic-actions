name: "[spoolix] Production"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Run fmt checks
        run: just ci-fmt

  # Route smoke by coverage-manifest category (P1-08 / T10).
  # One job; display name includes category. ci-driver-route dispatches:
  #   virtual_printer → ci-virtual-printer-route-e2e / host queue smoke
  #   direct_transport (linux.ipp-usb, windows.winusb) → ci-direct-transport-smoke
  # This job is NOT the two-page oracle (see ci-*-oracle scaffolding).
  driver-route-check:
    name: Route smoke / ${{ matrix.category }} / ${{ matrix.route }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [fmt]
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: linux.cups
            category: virtual_printer
            os: ubuntu-latest
          - route: linux.printer-application
            category: virtual_printer
            os: ubuntu-latest
          - route: linux.ipp-usb
            category: direct_transport
            os: ubuntu-latest
          - route: macos.cups
            category: virtual_printer
            os: macos-latest
          - route: macos.ipp-airprint
            category: virtual_printer
            os: macos-latest
          - route: windows.spooler
            category: virtual_printer
            os: windows-latest
          - route: windows.unidrv
            category: virtual_printer
            os: windows-latest
          - route: windows.ipp
            category: virtual_printer
            os: windows-latest
          - route: windows.winusb
            category: direct_transport
            os: windows-latest
          - route: windows.print-support-app
            category: virtual_printer
            os: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Linux CUPS dependencies
        if: ${{ matrix.route == 'linux.cups' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cups cups-client cups-filters cups-ipp-utils
          just ci-setup-linux-cups-state
          sudo systemctl start cups || sudo service cups start

      - name: Install Linux Printer Application dependencies
        if: ${{ matrix.route == 'linux.printer-application' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cups-ipp-utils libdbus-1-dev pkg-config
          just ci-setup-linux-printer-application-host

      - name: Install Linux ipp-usb dependencies
        if: ${{ matrix.route == 'linux.ipp-usb' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Ensure macOS CUPS is running
        if: ${{ matrix.route == 'macos.cups' }}
        run: |
          lpstat -r || sudo launchctl kickstart -k system/org.cups.cupsd
          lpstat -r

      - name: Prepare macOS privileged route authority
        if: ${{ matrix.route == 'macos.cups' }}
        run: just ci-setup-macos-privileged-route-authority

      - name: Prepare Windows Spoolix host anchor
        if: ${{ matrix.route == 'windows.spooler' }}
        shell: pwsh
        run: |
          net session *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Windows Spooler E2E requires an elevated administrator token"
          }
          if (-not (Get-PrinterDriver -Name "Generic / Text Only" -ErrorAction SilentlyContinue)) {
            Add-PrinterDriver -Name "Generic / Text Only"
          }
          Get-PrinterDriver -Name "Generic / Text Only" -ErrorAction Stop | Out-Null

      - name: Run route smoke
        shell: bash
        run: |
          case "${{ matrix.route }}" in
            windows.spooler) export SPOOLIX_WINDOWS_SPOOLER_E2E_REQUIRED=1 ;;
            macos.cups) export SPOOLIX_MACOS_CUPS_E2E_REQUIRED=1 ;;
            linux.printer-application) export SPOOLIX_LINUX_PA_E2E_REQUIRED=1 ;;
          esac
          just ci-driver-route "${{ matrix.route }}"

      - name: Teardown macOS CI harness
        if: ${{ always() && matrix.route == 'macos.cups' }}
        shell: bash
        run: bash .github/scripts/teardown-macos-ci-harness.sh

  # P2-10: Desktop typecheck + Vitest once on Ubuntu (do not matrix across OS).
  desktop-check:
    name: Desktop check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [fmt]
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libdbus-1-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Node dependencies
        shell: bash
        run: npm ci

      - name: Run desktop check
        shell: bash
        run: just desktop-check

  # P1-06 / T11: Route × profile oracle matrix.
  # Claimed routes run with SPOOLIX_ROUTE_ORACLE_REQUIRED=1; pending routes keep
  # the explicit two_page_oracle=false skip until their host proof is promoted.
  route-oracle-matrix:
    name: Route oracle / ${{ matrix.route }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [fmt]
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: linux.cups
            profile: tspl
            os: ubuntu-latest
          - route: linux.cups
            profile: cpcl
            os: ubuntu-latest
          - route: linux.cups
            profile: escpos
            os: ubuntu-latest
          - route: linux.printer-application
            profile: tspl
            os: ubuntu-latest
          - route: linux.printer-application
            profile: cpcl
            os: ubuntu-latest
          - route: linux.printer-application
            profile: escpos
            os: ubuntu-latest
          - route: windows.spooler
            profile: tspl
            os: windows-latest
          - route: windows.spooler
            profile: cpcl
            os: windows-latest
          - route: windows.spooler
            profile: escpos
            os: windows-latest
          - route: macos.cups
            profile: tspl
            os: macos-latest
          - route: macos.cups
            profile: cpcl
            os: macos-latest
          - route: macos.cups
            profile: escpos
            os: macos-latest
          - route: macos.ipp-airprint
            profile: tspl
            os: macos-latest
          - route: macos.ipp-airprint
            profile: cpcl
            os: macos-latest
          - route: macos.ipp-airprint
            profile: escpos
            os: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Linux oracle build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cups cups-client cups-filters cups-ipp-utils libdbus-1-dev pkg-config
          sudo systemctl start cups || sudo service cups start

      - name: Run route oracle
        shell: bash
        env:
          # Claimed routes must execute; pending routes retain the honest skip path.
          SPOOLIX_ROUTE_ORACLE_REQUIRED: ${{ (matrix.route == 'linux.cups' || matrix.route == 'linux.printer-application') && '1' || '0' }}
        run: just ci-route-oracle "${{ matrix.route }}" "${{ matrix.profile }}"

  # Candidate proof runs independently of two_page_oracle=false. Promotion is
  # allowed only after all three fresh profile jobs are green.
  macos-cups-candidate-oracle:
    name: macOS CUPS candidate / ${{ matrix.profile }}
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [fmt]
    strategy:
      fail-fast: false
      matrix:
        profile: [tspl, cpcl, escpos]
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Ensure macOS CUPS is running
        shell: bash
        run: |
          lpstat -r || sudo launchctl kickstart -k system/org.cups.cupsd
          lpstat -r

      - name: Run production-facade candidate oracle
        shell: bash
        env:
          SPOOLIX_ROUTE_ORACLE_REQUIRED: "1"
        run: just ci-macos-cups-oracle "${{ matrix.profile }}"

      - name: Teardown macOS CI harness
        if: ${{ always() }}
        shell: bash
        run: bash .github/scripts/teardown-macos-ci-harness.sh

  platform-check:
    name: Platform check / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            command: ci-check-linux
          - platform: windows
            os: windows-latest
            command: ci-check-windows
          - platform: macos
            os: macos-latest
            command: ci-check-macos
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Linux platform dependencies
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Desktop dependencies
        if: ${{ matrix.platform != 'linux' }}
        shell: bash
        run: npm ci

      - name: Run platform check
        shell: bash
        run: just "${{ matrix.command }}"
