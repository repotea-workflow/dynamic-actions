name: "[ztoms] Production"

on:
  push:
    tags:
      - "v*-ztoms"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual production workflow mode"
        required: true
        default: "build-only"
        type: choice
        options:
          - "build-only"

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_UHUB: uhub.service.ucloud.cn

concurrency:
  group: ztoms-production-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    outputs:
      ghcr_image: ${{ steps.tags.outputs.ghcr_sha }}
      uhub_image: ${{ steps.tags.outputs.uhub_sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/ztoms
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Set source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (UHub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_UHUB_USERNAME_ZTOKR }}
          password: ${{ secrets.CR_UHUB_PASSWORD_ZTOKR }}
          registry: ${{ env.DOCKER_REGISTRY_UHUB }}

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/ztoms-backend:sha-${{ env.SOURCE_SHA }}" >> $GITHUB_OUTPUT
          echo "uhub_sha=${{ env.DOCKER_REGISTRY_UHUB }}/toohub/ztoms-backend:sha-${{ env.SOURCE_SHA }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/omsk-pompeii.Dockerfile
          platforms: linux/amd64
          provenance: true
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.uhub_sha }}

      - name: Verify backend registry manifests
        run: |
          python3 scripts/omsk_gitops_switch_readiness.py \
            --registry-image "${{ steps.tags.outputs.ghcr_sha }}" \
            --registry-image "${{ steps.tags.outputs.uhub_sha }}" \
            --require-registry-provenance

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    outputs:
      ghcr_image: ${{ steps.tags.outputs.ghcr_sha }}
      uhub_image: ${{ steps.tags.outputs.uhub_sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/ztoms
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Set source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (UHub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_UHUB_USERNAME_ZTOKR }}
          password: ${{ secrets.CR_UHUB_PASSWORD_ZTOKR }}
          registry: ${{ env.DOCKER_REGISTRY_UHUB }}

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/ztoms-web:sha-${{ env.SOURCE_SHA }}" >> $GITHUB_OUTPUT
          echo "uhub_sha=${{ env.DOCKER_REGISTRY_UHUB }}/toohub/ztoms-web:sha-${{ env.SOURCE_SHA }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/omsk-control-web.Dockerfile
          platforms: linux/amd64
          provenance: true
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.uhub_sha }}

      - name: Verify web registry manifests
        run: |
          python3 scripts/omsk_gitops_switch_readiness.py \
            --registry-image "${{ steps.tags.outputs.ghcr_sha }}" \
            --registry-image "${{ steps.tags.outputs.uhub_sha }}" \
            --require-registry-provenance

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-web
    outputs:
      gitops_revision: ${{ steps.gitops.outputs.revision }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/ztoms
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Set source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Checkout production GitOps
        uses: actions/checkout@v6
        with:
          repository: repotea-workflow/gitops-fes
          ssh-key: "${{ secrets.DEPLOY_KEY_GITOPS_FES }}"
          path: target/production-gitops
          fetch-depth: 0

      - name: Verify immutable production tuple
        id: gitops
        run: |
          gitops_revision="$(git -C target/production-gitops rev-parse HEAD)"
          python3 scripts/omsk_gitops_switch_readiness.py \
            --gitops-repo target/production-gitops \
            --gitops-revision "$gitops_revision" \
            --backend-image "${{ needs.build-backend.outputs.uhub_image }}" \
            --web-image "${{ needs.build-web.outputs.uhub_image }}"
          echo "revision=$gitops_revision" >> "$GITHUB_OUTPUT"

  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build-backend
      - build-web
      - release-readiness
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/ztoms
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Set source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Checkout verified production GitOps revision
        uses: actions/checkout@v6
        with:
          repository: repotea-workflow/gitops-fes
          ssh-key: "${{ secrets.DEPLOY_KEY_GITOPS_FES }}"
          path: gitops-repo
          fetch-depth: 0

      - name: Confirm verified production GitOps revision
        run: >-
          test "$(git -C gitops-repo rev-parse HEAD)" =
          "${{ needs.release-readiness.outputs.gitops_revision }}"

      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-fes
          deploy_key: "${{ secrets.DEPLOY_KEY_GITOPS_FES }}"
          changes: |
            {
              "argocd/work/ztoms-ula/overlays/production/ztoms/values.yaml": {
                "ztomsV3.images.backend": "${{ needs.build-backend.outputs.uhub_image }}",
                "ztomsV3.images.web": "${{ needs.build-web.outputs.uhub_image }}",
                "ztomsV3.migration.enabled": true,
                "ztomsV3.migration.image": "${{ needs.build-backend.outputs.uhub_image }}",
                "ztomsV3.migration.databaseUrlSecretRef.name": "secret-ztoms-v3-env",
                "ztomsV3.migration.databaseUrlSecretRef.key": "DATABASE_URL"
              }
            }

      - name: Resolve deployed GitOps revision
        run: echo "EXPECTED_GITOPS_REVISION=$(git -C gitops-repo rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup ArgoCD CLI
        uses: imajeetyadav/argocd-cli@0ae59c231f4b6d4415dbffc2d2a9da515d014d64

      - name: Request Argo Sync
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_FES_API_TOKEN }}
        run: >-
          argocd --server=${{ secrets.ARGOCD_FES_SERVER }}
          app sync work-production-ztoms-ula
          --revision "$EXPECTED_GITOPS_REVISION"
          --async

      - name: Wait for Argo Synced Healthy
        env:
          ARGOCD_API_TOKEN: ${{ secrets.ARGOCD_FES_API_TOKEN }}
        run: >-
          scripts/wait_for_argocd_application.sh
          "${{ secrets.ARGOCD_FES_SERVER }}"
          work-production-ztoms-ula
          "$EXPECTED_GITOPS_REVISION"
          "${{ needs.build-backend.outputs.uhub_image }}"
          "${{ needs.build-web.outputs.uhub_image }}"
          production
          ztoms-ztoms-helm-v3-migration

      - name: Production smoke
        run: |
          curl --fail --show-error --silent --max-time 20 https://omsk-cusco.ztokr.com/ >/dev/null
          curl --fail --show-error --silent --max-time 20 https://omsk-roman.ztokr.com/ >/dev/null
          curl --fail --show-error --silent --max-time 20 https://omsk-api.ztokr.com/ >/dev/null
