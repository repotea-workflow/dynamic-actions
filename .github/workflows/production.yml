name: "[spoolix] Production"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just
      - name: Run fmt checks
        run: just ci-fmt

  # Route smoke by coverage-manifest category (P1-08 / T10).
  # One job; display name includes category. ci-driver-route dispatches:
  #   virtual_printer → ci-virtual-printer-route-e2e / host queue smoke
  #   direct_transport (linux.ipp-usb, windows.winusb) → ci-direct-transport-smoke
  # This job is NOT the two-page oracle (see ci-*-oracle scaffolding).
  driver-route-check:
    name: Route smoke / ${{ matrix.category }} / ${{ matrix.route }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: linux.cups
            category: virtual_printer
            os: ubuntu-latest
            timeout: 20
          - route: linux.printer-application
            category: virtual_printer
            os: ubuntu-latest
            timeout: 20
          - route: linux.ipp-usb
            category: direct_transport
            os: ubuntu-latest
            timeout: 20
          - route: macos.ipp-airprint
            category: virtual_printer
            os: macos-latest
            timeout: 20
          - route: macos.cups
            category: virtual_printer
            os: macos-latest
            timeout: 20
          - route: windows.winusb
            category: direct_transport
            os: windows-latest
            timeout: 40
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Linux CUPS dependencies
        if: ${{ matrix.route == 'linux.cups' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cups cups-client cups-filters cups-ipp-utils
          just ci-setup-linux-cups-state
          sudo systemctl start cups || sudo service cups start

      - name: Install Linux Printer Application dependencies
        if: ${{ matrix.route == 'linux.printer-application' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cups-ipp-utils libdbus-1-dev pkg-config
          just ci-setup-linux-printer-application-host

      - name: Install Linux ipp-usb dependencies
        if: ${{ matrix.route == 'linux.ipp-usb' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Prepare isolated Windows CI service-artifact anchor
        if: ${{ matrix.route == 'windows.spooler' }}
        shell: pwsh
        run: |
          net session *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Windows Spooler E2E requires an elevated administrator token"
          }
          if (-not (Get-PrinterDriver -Name "Generic / Text Only" -ErrorAction SilentlyContinue)) {
            Add-PrinterDriver -Name "Generic / Text Only"
          }
          Get-PrinterDriver -Name "Generic / Text Only" -ErrorAction Stop | Out-Null
          $component = "gha-${{ github.run_id }}-${{ github.run_attempt }}-route-smoke-windows-spooler"
          $anchor = just ci-prepare-windows-test-artifact-anchor $component
          if ($LASTEXITCODE -ne 0 -or -not $anchor) {
            throw "failed to provision the Windows service-artifact test anchor"
          }
          "SPOOLIX_WINDOWS_TEST_ARTIFACT_ANCHOR=$anchor" >> $env:GITHUB_ENV
          "SPOOLIX_WINDOWS_TEST_ARTIFACT_COMPONENT=$component" >> $env:GITHUB_ENV

      - name: Run route smoke
        shell: bash
        run: |
          case "${{ matrix.route }}" in
            windows.spooler) export SPOOLIX_WINDOWS_SPOOLER_E2E_REQUIRED=1 ;;
            linux.printer-application) export SPOOLIX_LINUX_PA_E2E_REQUIRED=1 ;;
          esac
          just ci-driver-route "${{ matrix.route }}"

      - name: Teardown Windows service-artifact test anchor
        if: ${{ always() && matrix.route == 'windows.spooler' }}
        shell: pwsh
        run: |
          $component = "gha-${{ github.run_id }}-${{ github.run_attempt }}-route-smoke-windows-spooler"
          just ci-teardown-windows-test-artifact-anchor $component
          $teardownExit = $LASTEXITCODE
          if ($teardownExit -ne 0) {
            [Console]::Error.WriteLine("Windows CI run-anchor teardown failed closed; the independent authority root was retained (exit $teardownExit)")
            exit $teardownExit
          }

  # P2-10: Desktop typecheck + Vitest once on Ubuntu (do not matrix across OS).
  desktop-check:
    name: Desktop check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libdbus-1-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Node dependencies
        shell: bash
        run: npm ci

      - name: Run desktop check
        shell: bash
        run: just desktop-check

  # P1-06 / T11: Route × profile oracle matrix.
  # Only claimed routes belong in this formal matrix, and every entry runs with
  # SPOOLIX_ROUTE_ORACLE_REQUIRED=1. Pending proofs use explicitly named
  # candidate jobs instead of green skip entries.
  route-oracle-matrix:
    name: Route oracle / ${{ matrix.route }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: linux.cups
            profile: tspl
            os: ubuntu-latest
            timeout: 20
          - route: linux.cups
            profile: cpcl
            os: ubuntu-latest
            timeout: 20
          - route: linux.cups
            profile: escpos
            os: ubuntu-latest
            timeout: 20
          - route: linux.printer-application
            profile: tspl
            os: ubuntu-latest
            timeout: 20
          - route: linux.printer-application
            profile: cpcl
            os: ubuntu-latest
            timeout: 20
          - route: linux.printer-application
            profile: escpos
            os: ubuntu-latest
            timeout: 20
          - route: macos.cups
            profile: tspl
            os: macos-latest
            timeout: 30
          - route: macos.cups
            profile: cpcl
            os: macos-latest
            timeout: 30
          - route: macos.cups
            profile: escpos
            os: macos-latest
            timeout: 30
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Linux oracle build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cups cups-client cups-filters cups-ipp-utils libdbus-1-dev pkg-config
          sudo systemctl start cups || sudo service cups start

      - name: Ensure macOS CUPS is running
        if: ${{ matrix.route == 'macos.cups' }}
        shell: bash
        run: |
          lpstat -r || sudo launchctl kickstart -k system/org.cups.cupsd
          lpstat -r

      - name: Run route oracle
        shell: bash
        env:
          # Every entry in the formal oracle matrix is a claimed route and must execute.
          SPOOLIX_ROUTE_ORACLE_REQUIRED: "1"
        run: just ci-route-oracle "${{ matrix.route }}" "${{ matrix.profile }}"

      - name: Teardown macOS CI harness
        if: ${{ always() && matrix.route == 'macos.cups' }}
        shell: bash
        run: |
          bash .github/scripts/teardown-macos-ci-harness.sh
          bash .github/scripts/teardown-macos-ci-harness.sh

  macos-airprint-candidate-oracle:
    name: macOS AirPrint candidate / ${{ matrix.profile }}
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [tspl, cpcl, escpos]
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Ensure macOS CUPS is running
        shell: bash
        run: |
          lpstat -r || sudo launchctl kickstart -k system/org.cups.cupsd
          lpstat -r

      - name: Select macOS AirPrint bind address
        shell: bash
        run: |
          bind_address="$(bash .github/scripts/select-macos-airprint-bind-address.sh)"
          echo "SPOOLIX_AIRPRINT_BIND_ADDRESS=$bind_address" >> "$GITHUB_ENV"

      - name: Run macOS AirPrint candidate oracle
        shell: bash
        run: just ci-macos-airprint-oracle "${{ matrix.profile }}"

      - name: Capture macOS AirPrint diagnostics
        if: ${{ always() }}
        shell: bash
        run: bash .github/scripts/collect-macos-airprint-ci-diagnostics.sh target/macos-airprint-ci-diagnostics-candidate || true

      - name: Upload macOS AirPrint diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-airprint-diagnostics-${{ matrix.profile }}
          path: target/macos-airprint-ci-diagnostics-candidate
          if-no-files-found: ignore

      - name: Teardown macOS AirPrint success harness
        if: ${{ always() }}
        shell: bash
        run: |
          bash .github/scripts/teardown-macos-ci-harness.sh
          bash .github/scripts/teardown-macos-ci-harness.sh

      - name: Run macOS AirPrint cleanup failure matrix
        if: ${{ success() }}
        shell: bash
        run: just ci-macos-airprint-cleanup-oracle "${{ matrix.profile }}"

      - name: Capture macOS AirPrint cleanup diagnostics
        if: ${{ always() }}
        shell: bash
        run: bash .github/scripts/collect-macos-airprint-ci-diagnostics.sh target/macos-airprint-ci-diagnostics-cleanup || true

      - name: Upload macOS AirPrint cleanup diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-airprint-cleanup-diagnostics-${{ matrix.profile }}
          path: target/macos-airprint-ci-diagnostics-cleanup
          if-no-files-found: ignore

      - name: Teardown macOS CI harness
        if: ${{ always() }}
        shell: bash
        run: |
          bash .github/scripts/teardown-macos-ci-harness.sh
          bash .github/scripts/teardown-macos-ci-harness.sh

  windows-product-infrastructure:
    name: Windows product infrastructure
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SPOOLIX_WINDOWS_IPP_SPIKE_OPT_IN: I_UNDERSTAND_HOST_MUTATION
      SPOOLIX_WINDOWS_IPP_SPIKE_DISPOSABLE_HOST: I_CONFIRM_DISPOSABLE_HOST
      SPOOLIX_WINDOWS_IPP_SPIKE_LEASE_ID: lease:github-actions-windows-ipp-controls
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt
      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Run Windows product infrastructure checks
        shell: bash
        run: just ci-windows-product-infrastructure
      - name: Run Windows IPP GDI renderer control
        if: ${{ always() }}
        shell: bash
        run: just ci-windows-ipp-control gdi-render-baseline
      - name: Run Windows IPP reference endpoint control
        if: ${{ always() }}
        shell: bash
        run: just ci-windows-ipp-control ipp-reference-baseline
      - name: Run Windows IPP direct PWG control
        if: ${{ always() }}
        shell: bash
        run: just ci-windows-ipp-control spoolix-direct-pwg
      - name: Prepare PrintService operational diagnostics
        id: printservice_prepare
        if: ${{ always() }}
        shell: pwsh
        run: .github/scripts/windows-printservice-operational.ps1 -Mode Enable -StatePath "$env:RUNNER_TEMP\spoolix-printservice-operational-spoolix-gdi-diagnostic.json" -Lane "spoolix-gdi-diagnostic"
      - name: Run Windows IPP Spoolix GDI diagnostic
        if: ${{ always() && steps.printservice_prepare.outcome == 'success' }}
        shell: bash
        run: just ci-windows-ipp-control spoolix-gdi-diagnostic
      - name: Restore PrintService operational diagnostics
        if: ${{ always() && steps.printservice_prepare.outcome != 'skipped' }}
        shell: pwsh
        run: .github/scripts/windows-printservice-operational.ps1 -Mode Restore -StatePath "$env:RUNNER_TEMP\spoolix-printservice-operational-spoolix-gdi-diagnostic.json" -Lane "spoolix-gdi-diagnostic"

  # One expensive job per product route; all three profiles run sequentially
  # inside that job so one Windows allocation returns the complete result set.
  windows-product-route-oracle:
    name: Windows product oracle / ${{ matrix.route }} / all profiles
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: windows.spooler
            timeout: 75
          - route: windows.ipp
            timeout: 90
          - route: windows.unidrv
            timeout: 120
          - route: windows.print-support-app
            timeout: 120
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt
      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Initialize signed route evidence
        shell: pwsh
        run: |
          $bytes = [byte[]]::new(32)
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $key = [Convert]::ToHexString($bytes).ToLowerInvariant()
          Write-Output "::add-mask::$key"
          "SPOOLIX_WINDOWS_ROUTE_EVIDENCE_KEY=$key" >> $env:GITHUB_ENV
          "SPOOLIX_WINDOWS_ROUTE_EVIDENCE_PATH=$env:RUNNER_TEMP\spoolix-${{ matrix.route }}-route-evidence.json" >> $env:GITHUB_ENV
      - name: Confirm disposable elevated Windows runner
        shell: pwsh
        run: |
          net session *> $null
          if ($LASTEXITCODE -ne 0) { throw "Windows product oracle requires elevation" }
      - name: Prepare Spooler RAW driver and service-artifact anchor
        if: ${{ matrix.route == 'windows.spooler' }}
        shell: pwsh
        run: |
          if (-not (Get-PrinterDriver -Name "Generic / Text Only" -ErrorAction SilentlyContinue)) { Add-PrinterDriver -Name "Generic / Text Only" }
          Get-PrinterDriver -Name "Generic / Text Only" -ErrorAction Stop | Out-Null
          $component = "gha-${{ github.run_id }}-${{ github.run_attempt }}-oracle-windows-spooler"
          $anchor = just ci-prepare-windows-test-artifact-anchor $component
          if ($LASTEXITCODE -ne 0 -or -not $anchor) { throw "failed to prepare Spooler artifact anchor" }
          "SPOOLIX_WINDOWS_TEST_ARTIFACT_ANCHOR=$anchor" >> $env:GITHUB_ENV
          "SPOOLIX_WINDOWS_TEST_ARTIFACT_COMPONENT=$component" >> $env:GITHUB_ENV
      - name: Install Windows Driver Kit tools
        if: ${{ matrix.route == 'windows.unidrv' }}
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'spoolix-wdk-evidence.json'
          $lines = & platform/windows/unidrv/package/prepare-wdk-tools.ps1 -EvidencePath $evidence
          foreach ($line in $lines) {
            if ($line -match '^SPOOLIX_WINDOWS_WDK_(TOOL_ROOT|EVIDENCE)=') { $line >> $env:GITHUB_ENV }
          }
          if (-not ($lines -match '^SPOOLIX_WINDOWS_WDK_TOOL_ROOT=')) { throw 'WDK tool root output is missing' }
          if (-not ($lines -match '^SPOOLIX_WINDOWS_WDK_EVIDENCE=')) { throw 'WDK evidence output is missing' }
      - name: Build and seal Unidrv package once
        if: ${{ matrix.route == 'windows.unidrv' }}
        shell: pwsh
        run: |
          cargo build -p spoolix-platform-windows-unidrv --release --locked
          if ($LASTEXITCODE -ne 0) { throw "Unidrv monitor build failed" }
          $monitor = Join-Path $PWD 'target\release\spoolix_platform_windows_unidrv.dll'
          $output = Join-Path $env:RUNNER_TEMP "spoolix-unidrv-package-${{ github.run_id }}-${{ github.run_attempt }}"
          "SPOOLIX_WINDOWS_UNIDRV_PACKAGE_ROOT=$output" >> $env:GITHUB_ENV
          $lines = & platform/windows/unidrv/package/prepare-host-oracle.ps1 -OutputRoot $output -MonitorDll $monitor
          if ($LASTEXITCODE -ne 0) { throw "Unidrv package preparation failed" }
          $authorityPath = Join-Path $output 'host-oracle-authority.json'
          if (-not (Test-Path -LiteralPath $authorityPath -PathType Leaf)) { throw "Unidrv authority file is missing: $authorityPath" }
          "SPOOLIX_WINDOWS_UNIDRV_PACKAGE_AUTHORITY=$authorityPath" >> $env:GITHUB_ENV
          foreach ($line in $lines) {
            if ($line -match '^SPOOLIX_WINDOWS_UNIDRV_(PACKAGE_AUTHORITY|CERT_THUMBPRINT)=') { $line >> $env:GITHUB_ENV }
          }
          if (-not ($lines -match '^SPOOLIX_WINDOWS_UNIDRV_PACKAGE_AUTHORITY=')) { throw "Unidrv authority output is missing" }
          if (-not ($lines -match '^SPOOLIX_WINDOWS_UNIDRV_CERT_THUMBPRINT=')) { throw "Unidrv certificate output is missing" }
      - name: Install canonical Unidrv product package
        if: ${{ matrix.route == 'windows.unidrv' }}
        shell: pwsh
        run: |
          $receipt = cargo run -p spoolix-platform-windows-unidrv --example manage_product_package --locked -- install $env:SPOOLIX_WINDOWS_UNIDRV_PACKAGE_ROOT
          if ($LASTEXITCODE -ne 0 -or -not $receipt) { throw 'Unidrv product package install failed' }
          $receiptPath = Join-Path $env:RUNNER_TEMP 'spoolix-unidrv-product-package-receipt.json'
          $receipt | Set-Content -LiteralPath $receiptPath -Encoding utf8NoBOM
          "SPOOLIX_WINDOWS_UNIDRV_PRODUCT_PACKAGE_RECEIPT=$receiptPath" >> $env:GITHUB_ENV
      - name: Prepare Print Support NuGet lock evidence
        id: psa_lock
        if: ${{ matrix.route == 'windows.print-support-app' }}
        shell: pwsh
        run: |
          $lock = 'platform/windows/print-support/package/packages.lock.json'
          $evidence = Join-Path $env:RUNNER_TEMP 'spoolix-psa-nuget-lock-evidence.json'
          if (Test-Path -LiteralPath $lock -PathType Leaf) {
            $json = & platform/windows/print-support/package/generate-packages-lock.ps1 -Mode Verify
            "SPOOLIX_WINDOWS_ROUTE_PREFLIGHT_STATUS=0" >> $env:GITHUB_ENV
          } else {
            $json = & platform/windows/print-support/package/generate-packages-lock.ps1 -Mode Generate
            "SPOOLIX_WINDOWS_ROUTE_PREFLIGHT_STATUS=101" >> $env:GITHUB_ENV
          }
          $json | Set-Content -LiteralPath $evidence -Encoding utf8NoBOM
      - name: Prepare Print Support MSBuild tooling
        id: psa_tools
        if: ${{ matrix.route == 'windows.print-support-app' && steps.psa_lock.outcome == 'success' }}
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'spoolix-psa-build-tools-evidence.json'
          $lines = & platform/windows/print-support/package/prepare-build-tools.ps1 -EvidencePath $evidence -InstallIfMissing
          if ($LASTEXITCODE -ne 0) { throw 'Print Support build-tool preparation failed' }
          foreach ($line in $lines) {
            if ($line -match '^SPOOLIX_WINDOWS_PSA_(MSBUILD|BUILD_TOOLS_EVIDENCE)=') { $line >> $env:GITHUB_ENV }
          }
          if (-not ($lines -match '^SPOOLIX_WINDOWS_PSA_MSBUILD=')) { throw 'Print Support MSBuild path output is missing' }
          if (-not ($lines -match '^SPOOLIX_WINDOWS_PSA_BUILD_TOOLS_EVIDENCE=')) { throw 'Print Support build-tools evidence output is missing' }
      - name: Build signed Print Support package
        id: psa_package
        if: ${{ matrix.route == 'windows.print-support-app' && steps.psa_lock.outcome == 'success' && steps.psa_tools.outcome == 'success' }}
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "spoolix-psa-package-${{ github.run_id }}-${{ github.run_attempt }}"
          "SPOOLIX_WINDOWS_PSA_PACKAGE_ROOT=$output" >> $env:GITHUB_ENV
          $receipt = platform/windows/print-support/package/build-test-package.ps1 -OutputDirectory $output
          if ($LASTEXITCODE -ne 0 -or -not $receipt) { throw "Print Support package build failed" }
          $receiptPath = Join-Path $env:RUNNER_TEMP 'spoolix-psa-package-receipt.json'
          $receipt | Set-Content -LiteralPath $receiptPath -Encoding utf8NoBOM
          "SPOOLIX_WINDOWS_PRINT_SUPPORT_PACKAGE_RECEIPT=$receiptPath" >> $env:GITHUB_ENV
      - name: Upload Print Support package build diagnostics
        if: ${{ always() && matrix.route == 'windows.print-support-app' && env.SPOOLIX_WINDOWS_PSA_PACKAGE_ROOT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-print-support-build-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ env.SPOOLIX_WINDOWS_PSA_PACKAGE_ROOT }}
      - name: Mark Print Support package preflight failure
        if: ${{ always() && matrix.route == 'windows.print-support-app' && steps.psa_package.outcome != 'success' }}
        shell: pwsh
        run: |
          "SPOOLIX_WINDOWS_ROUTE_PREFLIGHT_STATUS=101" >> $env:GITHUB_ENV
      - name: Run all three route candidates
        if: ${{ always() }}
        shell: bash
        run: just ci-windows-product-route-candidate-batch "${{ matrix.route }}" "$SPOOLIX_WINDOWS_ROUTE_EVIDENCE_PATH"
      - name: Enforce formal coverage gate
        if: ${{ always() }}
        shell: bash
        run: just ci-windows-product-route-required-gate "${{ matrix.route }}" "$SPOOLIX_WINDOWS_ROUTE_EVIDENCE_PATH"
      - name: Upload signed route evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-route-evidence-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ env.SPOOLIX_WINDOWS_ROUTE_EVIDENCE_PATH }}
      - name: Upload Unidrv package and WDK evidence
        if: ${{ always() && matrix.route == 'windows.unidrv' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-unidrv-package-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ env.SPOOLIX_WINDOWS_WDK_EVIDENCE }}
            ${{ env.SPOOLIX_WINDOWS_UNIDRV_PACKAGE_ROOT }}
            ${{ env.SPOOLIX_WINDOWS_UNIDRV_PRODUCT_PACKAGE_RECEIPT }}
      - name: Upload generated Print Support lock and package evidence
        if: ${{ always() && matrix.route == 'windows.print-support-app' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-print-support-lock-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            platform/windows/print-support/package/packages.lock.json
            ${{ runner.temp }}/spoolix-psa-nuget-lock-evidence.json
            ${{ runner.temp }}/spoolix-psa-build-tools-evidence.json
            ${{ runner.temp }}/spoolix-psa-package-receipt.json
            ${{ env.SPOOLIX_WINDOWS_PSA_PACKAGE_ROOT }}
      - name: Teardown canonical Unidrv product package
        if: ${{ always() && matrix.route == 'windows.unidrv' && env.SPOOLIX_WINDOWS_UNIDRV_PRODUCT_PACKAGE_RECEIPT != '' }}
        shell: pwsh
        run: cargo run -p spoolix-platform-windows-unidrv --example manage_product_package --locked -- teardown $env:SPOOLIX_WINDOWS_UNIDRV_PRODUCT_PACKAGE_RECEIPT
      - name: Remove run-scoped Unidrv certificate
        if: ${{ always() && matrix.route == 'windows.unidrv' && env.SPOOLIX_WINDOWS_UNIDRV_CERT_THUMBPRINT != '' }}
        shell: pwsh
        run: platform/windows/unidrv/package/remove-host-oracle-certificate.ps1 -Thumbprint $env:SPOOLIX_WINDOWS_UNIDRV_CERT_THUMBPRINT
      - name: Teardown Spooler service-artifact anchor
        if: ${{ always() && matrix.route == 'windows.spooler' }}
        shell: pwsh
        run: |
          $component = "gha-${{ github.run_id }}-${{ github.run_attempt }}-oracle-windows-spooler"
          just ci-teardown-windows-test-artifact-anchor $component
          if ($LASTEXITCODE -ne 0) { throw "Spooler artifact anchor teardown failed closed" }
      - name: Verify route terminal inventory
        if: ${{ always() }}
        shell: pwsh
        run: |
          $prefix = "Spoolix gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.route }}"
          .github/scripts/verify-windows-product-route-terminal.ps1 -Route '${{ matrix.route }}' -DisplayPrefix $prefix

  platform-check:
    name: Platform check / ${{ matrix.platform }} / ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            command: ci-check-linux
            group: all
            needs_anchor: false
            needs_npm: false
            timeout: 20
          - platform: macos
            os: macos-latest
            command: ci-check-macos
            group: all
            needs_anchor: false
            needs_npm: true
            timeout: 20
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: virtual-printer
            needs_anchor: true
            needs_npm: false
            timeout: 30
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: management-command
            needs_anchor: false
            needs_npm: false
            timeout: 30
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: unified-coverage
            needs_anchor: false
            needs_npm: false
            timeout: 30
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: desktop
            needs_anchor: false
            needs_npm: true
            timeout: 20
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: cli
            needs_anchor: false
            needs_npm: false
            timeout: 20
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: windows-routes
            needs_anchor: false
            needs_npm: false
            timeout: 30
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: target-toolchains
            needs_anchor: false
            needs_npm: false
            timeout: 30
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: ipp-stability
            needs_anchor: false
            needs_npm: false
            timeout: 30
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: security-portable
            needs_anchor: false
            needs_npm: false
            timeout: 20
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: security-authority
            needs_anchor: false
            needs_npm: false
            timeout: 30
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: security-races
            needs_anchor: false
            needs_npm: false
            timeout: 30
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Linux platform dependencies
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Desktop dependencies
        if: ${{ matrix.needs_npm }}
        shell: bash
        run: npm ci

      - name: Prepare Windows service-artifact test anchor
        if: ${{ matrix.needs_anchor }}
        shell: pwsh
        run: |
          net session *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Windows platform checks require an elevated administrator token"
          }
          $component = "gha-${{ github.run_id }}-${{ github.run_attempt }}-platform-check-windows-${{ matrix.group }}"
          $anchor = just ci-prepare-windows-test-artifact-anchor $component
          if ($LASTEXITCODE -ne 0 -or -not $anchor) {
            throw "failed to provision the Windows service-artifact test anchor"
          }
          "SPOOLIX_WINDOWS_TEST_ARTIFACT_ANCHOR=$anchor" >> $env:GITHUB_ENV
          "SPOOLIX_WINDOWS_TEST_ARTIFACT_COMPONENT=$component" >> $env:GITHUB_ENV

      - name: Run platform check
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == windows ]]; then
            just "${{ matrix.command }}" "${{ matrix.group }}"
          else
            just "${{ matrix.command }}"
          fi

      - name: Teardown Windows service-artifact test anchor
        if: ${{ always() && matrix.needs_anchor }}
        shell: pwsh
        run: |
          $component = "gha-${{ github.run_id }}-${{ github.run_attempt }}-platform-check-windows-${{ matrix.group }}"
          just ci-teardown-windows-test-artifact-anchor $component
          $teardownExit = $LASTEXITCODE
          if ($teardownExit -ne 0) {
            [Console]::Error.WriteLine("Windows CI run-anchor teardown failed closed; the independent authority root was retained (exit $teardownExit)")
            exit $teardownExit
          }

      - name: Run root-owned macOS package authority tests
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: just ci-macos-package-root-authority-tests
