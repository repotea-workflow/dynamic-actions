name: "[spoolix] Staging"

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Run fmt checks
        run: just ci-fmt

  # Route smoke by coverage-manifest category (P1-08 / T10).
  # One job; display name includes category. ci-driver-route dispatches:
  #   virtual_printer → ci-virtual-printer-route-e2e / host queue smoke
  #   direct_transport (linux.ipp-usb, windows.winusb) → ci-direct-transport-smoke
  # This job is NOT the two-page oracle (see ci-*-oracle scaffolding).
  driver-route-check:
    name: Route smoke / ${{ matrix.category }} / ${{ matrix.route }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: linux.cups
            category: virtual_printer
            os: ubuntu-latest
            timeout: 20
          - route: linux.printer-application
            category: virtual_printer
            os: ubuntu-latest
            timeout: 20
          - route: linux.ipp-usb
            category: direct_transport
            os: ubuntu-latest
            timeout: 20
          - route: macos.ipp-airprint
            category: virtual_printer
            os: macos-latest
            timeout: 20
          - route: macos.cups
            category: virtual_printer
            os: macos-latest
            timeout: 20
          - route: windows.spooler
            category: virtual_printer
            os: windows-latest
            timeout: 40
          - route: windows.unidrv
            category: virtual_printer
            os: windows-latest
            timeout: 40
          - route: windows.ipp
            category: virtual_printer
            os: windows-latest
            timeout: 40
          - route: windows.winusb
            category: direct_transport
            os: windows-latest
            timeout: 40
          - route: windows.print-support-app
            category: virtual_printer
            os: windows-latest
            timeout: 40
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Linux CUPS dependencies
        if: ${{ matrix.route == 'linux.cups' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cups cups-client cups-filters cups-ipp-utils
          just ci-setup-linux-cups-state
          sudo systemctl start cups || sudo service cups start

      - name: Install Linux Printer Application dependencies
        if: ${{ matrix.route == 'linux.printer-application' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cups-ipp-utils libdbus-1-dev pkg-config
          just ci-setup-linux-printer-application-host

      - name: Install Linux ipp-usb dependencies
        if: ${{ matrix.route == 'linux.ipp-usb' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Prepare isolated Windows CI service-artifact anchor
        if: ${{ matrix.route == 'windows.spooler' }}
        shell: pwsh
        run: |
          net session *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Windows Spooler E2E requires an elevated administrator token"
          }
          if (-not (Get-PrinterDriver -Name "Generic / Text Only" -ErrorAction SilentlyContinue)) {
            Add-PrinterDriver -Name "Generic / Text Only"
          }
          Get-PrinterDriver -Name "Generic / Text Only" -ErrorAction Stop | Out-Null
          $component = "gha-${{ github.run_id }}-${{ github.run_attempt }}-route-smoke-windows-spooler"
          $anchor = just ci-prepare-windows-test-artifact-anchor $component
          if ($LASTEXITCODE -ne 0 -or -not $anchor) {
            throw "failed to provision the Windows service-artifact test anchor"
          }
          "SPOOLIX_WINDOWS_TEST_ARTIFACT_ANCHOR=$anchor" >> $env:GITHUB_ENV
          "SPOOLIX_WINDOWS_TEST_ARTIFACT_COMPONENT=$component" >> $env:GITHUB_ENV

      - name: Run route smoke
        shell: bash
        run: |
          case "${{ matrix.route }}" in
            windows.spooler) export SPOOLIX_WINDOWS_SPOOLER_E2E_REQUIRED=1 ;;
            linux.printer-application) export SPOOLIX_LINUX_PA_E2E_REQUIRED=1 ;;
          esac
          just ci-driver-route "${{ matrix.route }}"

      - name: Teardown Windows service-artifact test anchor
        if: ${{ always() && matrix.route == 'windows.spooler' }}
        shell: pwsh
        run: |
          $component = "gha-${{ github.run_id }}-${{ github.run_attempt }}-route-smoke-windows-spooler"
          just ci-teardown-windows-test-artifact-anchor $component
          $teardownExit = $LASTEXITCODE
          if ($teardownExit -ne 0) {
            [Console]::Error.WriteLine("Windows CI run-anchor teardown failed closed; the independent authority root was retained (exit $teardownExit)")
            exit $teardownExit
          }

  # P2-10: Desktop typecheck + Vitest once on Ubuntu (do not matrix across OS).
  desktop-check:
    name: Desktop check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libdbus-1-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Node dependencies
        shell: bash
        run: npm ci

      - name: Run desktop check
        shell: bash
        run: just desktop-check

  # P1-06 / T11: Route × profile oracle matrix.
  # Only claimed routes belong in this formal matrix, and every entry runs with
  # SPOOLIX_ROUTE_ORACLE_REQUIRED=1. Pending proofs use explicitly named
  # candidate jobs instead of green skip entries.
  route-oracle-matrix:
    name: Route oracle / ${{ matrix.route }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: linux.cups
            profile: tspl
            os: ubuntu-latest
          - route: linux.cups
            profile: cpcl
            os: ubuntu-latest
          - route: linux.cups
            profile: escpos
            os: ubuntu-latest
          - route: linux.printer-application
            profile: tspl
            os: ubuntu-latest
          - route: linux.printer-application
            profile: cpcl
            os: ubuntu-latest
          - route: linux.printer-application
            profile: escpos
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Linux oracle build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cups cups-client cups-filters cups-ipp-utils libdbus-1-dev pkg-config
          sudo systemctl start cups || sudo service cups start

      - name: Run route oracle
        shell: bash
        env:
          # Every entry in the formal oracle matrix is a claimed route and must execute.
          SPOOLIX_ROUTE_ORACLE_REQUIRED: "1"
        run: just ci-route-oracle "${{ matrix.route }}" "${{ matrix.profile }}"

  # Candidate proof runs independently of two_page_oracle=false. Promotion is
  # allowed only after all three fresh profile jobs are green.
  macos-cups-candidate-oracle:
    name: macOS CUPS candidate / ${{ matrix.profile }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [tspl, cpcl, escpos]
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Ensure macOS CUPS is running
        shell: bash
        run: |
          lpstat -r || sudo launchctl kickstart -k system/org.cups.cupsd
          lpstat -r

      - name: Run production-facade candidate oracle
        shell: bash
        env:
          SPOOLIX_ROUTE_ORACLE_REQUIRED: "1"
        run: just ci-macos-cups-oracle "${{ matrix.profile }}"

      - name: Teardown macOS CI harness
        if: ${{ always() }}
        shell: bash
        run: |
          bash .github/scripts/teardown-macos-ci-harness.sh
          bash .github/scripts/teardown-macos-ci-harness.sh

  # Product-route candidate only: runs the profile-specific Windows Spooler RAW
  # host test on a disposable elevated runner before coverage promotion. A
  # failing profile remains visible and does not cancel its peers. These jobs do
  # not claim arbitrary-application E2E or production management unified output.
  windows-spooler-raw-product-candidate:
    name: Windows Spooler RAW product candidate / ${{ matrix.profile }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [tspl, cpcl, escpos]
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Confirm disposable elevated Windows runner
        shell: pwsh
        run: |
          net session *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Windows Spooler RAW product candidate requires an elevated administrator token"
          }
          if (-not (Get-PrinterDriver -Name "Generic / Text Only" -ErrorAction SilentlyContinue)) {
            Add-PrinterDriver -Name "Generic / Text Only"
          }
          Get-PrinterDriver -Name "Generic / Text Only" -ErrorAction Stop | Out-Null

      - name: Run profile-specific product candidate
        shell: bash
        env:
          SPOOLIX_WINDOWS_SPOOLER_RAW_CANDIDATE_OPT_IN: I_UNDERSTAND_HOST_MUTATION
          SPOOLIX_WINDOWS_SPOOLER_RAW_CANDIDATE_DISPOSABLE_HOST: I_CONFIRM_DISPOSABLE_HOST
        run: just ci-windows-spooler-raw-product-candidate "${{ matrix.profile }}"

  # Diagnostic candidate only: this proves that a disposable Windows runner can
  # create an IPP queue and submit a real two-page GDI job into the loopback
  # receiver. It does not claim driver dispatch, parsed pages, or route oracle
  # coverage; the test itself requires and verifies that production remains
  # fail-closed.
  windows-ipp-host-spike-candidate:
    name: Windows IPP real-host candidate spike
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Confirm disposable elevated Windows runner
        shell: pwsh
        run: |
          net session *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Windows IPP host spike requires an elevated administrator token"
          }

      - name: Run real-host diagnostic spike
        shell: bash
        env:
          SPOOLIX_WINDOWS_IPP_SPIKE_OPT_IN: I_UNDERSTAND_HOST_MUTATION
          SPOOLIX_WINDOWS_IPP_SPIKE_DISPOSABLE_HOST: I_CONFIRM_DISPOSABLE_HOST
          SPOOLIX_WINDOWS_IPP_SPIKE_LEASE_ID: lease:github-actions-windows-ipp-spike
        run: just ci-windows-ipp-host-spike-candidate

  platform-check:
    name: Platform check / ${{ matrix.platform }} / ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            command: ci-check-linux
            group: all
            needs_anchor: false
            needs_npm: false
            timeout: 20
          - platform: macos
            os: macos-latest
            command: ci-check-macos
            group: all
            needs_anchor: false
            needs_npm: true
            timeout: 20
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: virtual-printer
            needs_anchor: true
            needs_npm: false
            timeout: 30
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: management-command
            needs_anchor: false
            needs_npm: false
            timeout: 30
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: unified-coverage
            needs_anchor: false
            needs_npm: false
            timeout: 30
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: desktop
            needs_anchor: false
            needs_npm: true
            timeout: 20
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: cli
            needs_anchor: false
            needs_npm: false
            timeout: 20
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: windows-routes
            needs_anchor: false
            needs_npm: false
            timeout: 30
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: security-portable
            needs_anchor: false
            needs_npm: false
            timeout: 20
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: security-authority
            needs_anchor: false
            needs_npm: false
            timeout: 30
          - platform: windows
            os: windows-latest
            command: ci-check-windows
            group: security-races
            needs_anchor: false
            needs_npm: false
            timeout: 30
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/spoolix
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          ref_file: .github/ref.txt

      - name: Authorize private Git dependencies
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GH_TOKEN_0X128BIT }}"
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Linux platform dependencies
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Desktop dependencies
        if: ${{ matrix.needs_npm }}
        shell: bash
        run: npm ci

      - name: Prepare Windows service-artifact test anchor
        if: ${{ matrix.needs_anchor }}
        shell: pwsh
        run: |
          net session *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Windows platform checks require an elevated administrator token"
          }
          $component = "gha-${{ github.run_id }}-${{ github.run_attempt }}-platform-check-windows-${{ matrix.group }}"
          $anchor = just ci-prepare-windows-test-artifact-anchor $component
          if ($LASTEXITCODE -ne 0 -or -not $anchor) {
            throw "failed to provision the Windows service-artifact test anchor"
          }
          "SPOOLIX_WINDOWS_TEST_ARTIFACT_ANCHOR=$anchor" >> $env:GITHUB_ENV
          "SPOOLIX_WINDOWS_TEST_ARTIFACT_COMPONENT=$component" >> $env:GITHUB_ENV

      - name: Run platform check
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == windows ]]; then
            just "${{ matrix.command }}" "${{ matrix.group }}"
          else
            just "${{ matrix.command }}"
          fi

      - name: Teardown Windows service-artifact test anchor
        if: ${{ always() && matrix.needs_anchor }}
        shell: pwsh
        run: |
          $component = "gha-${{ github.run_id }}-${{ github.run_attempt }}-platform-check-windows-${{ matrix.group }}"
          just ci-teardown-windows-test-artifact-anchor $component
          $teardownExit = $LASTEXITCODE
          if ($teardownExit -ne 0) {
            [Console]::Error.WriteLine("Windows CI run-anchor teardown failed closed; the independent authority root was retained (exit $teardownExit)")
            exit $teardownExit
          }

      - name: Run root-owned macOS package authority tests
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: just ci-macos-package-root-authority-tests
