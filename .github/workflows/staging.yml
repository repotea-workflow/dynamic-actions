name: "[pangea] Staging"

on:
  push:
    branches:
      - "**"

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI: registry.cn-hongkong.aliyuncs.com

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.matches }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure main
        id: ensure_main
        uses: repotea-workspace/kangumi/github-actions/dyn-source@main
        with:
          repository: boxliy/pangea
          branches: main

  build-image:
    name: Build ${{ matrix.package.image }}
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    strategy:
      fail-fast: false
      matrix:
        package:
          - image: pangea-strata
            context: terra/mantle
            file: terra/mantle/Dockerfile
          - image: pangea-basalt
            context: terra/mantle
            file: terra/mantle/services/basalt/Dockerfile
          - image: pangea-meridian
            context: carto/atlas
            file: carto/atlas/Dockerfile
          - image: pangea-space-key-broker
            context: terra/mantle
            file: terra/mantle/services/space-key-broker/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Checkout source repository
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/pangea
          token: "${{ secrets.GH_TOKEN_0X128BIT }}"
          source_context: "true"
          image_name: ${{ matrix.package.image }}
          acr_namespace: xoohub

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: '0x128bit'
          password: ${{ secrets.GH_TOKEN_0X128BIT }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        id: image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: mode=min
          sbom: false
          context: ${{ matrix.package.context }}
          file: ${{ matrix.package.file }}
          platforms: linux/amd64
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}
          annotations: index:org.opencontainers.image.source=${{ steps.checkout.outputs.oci_source }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            source_image="${{ steps.checkout.outputs.ghcr_image }}@${{ steps.image.outputs.digest }}"
            docker pull "$source_image"
            docker tag "$source_image" ${{ steps.checkout.outputs.ali_image }}:sha-${{ env.SHORT_SHA }}-${{ github.run_number }}
            docker tag "$source_image" ${{ steps.checkout.outputs.ali_sha }}
            docker tag "$source_image" ${{ steps.checkout.outputs.ali_staging }}
            docker push --platform linux/amd64 ${{ steps.checkout.outputs.ali_image }}:sha-${{ env.SHORT_SHA }}-${{ github.run_number }}
            docker push --platform linux/amd64 ${{ steps.checkout.outputs.ali_sha }}
            docker push --platform linux/amd64 ${{ steps.checkout.outputs.ali_staging }}
            echo "IMAGE_DIGEST=${{ steps.image.outputs.digest }}"
            echo "GHCR_IMAGE=${{ steps.checkout.outputs.ghcr_image }}"
            echo "GHCR_SHA=${{ steps.checkout.outputs.ghcr_sha }}"
            echo "ALI_IMAGE=${{ steps.checkout.outputs.ali_image }}"
