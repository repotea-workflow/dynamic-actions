name: "[codeoo] Staging"

on:
  push:
    branches:
      - "**"

permissions:
  actions: write
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ghcr.io/repotea-workflow/dynamic-actions/codeoo

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      is_main: ${{ steps.branch.outputs.is_main }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check source branch
        id: branch
        run: |
          if [ -f .github/branch.txt ] && grep -qx 'main' .github/branch.txt; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    name: Build image
    needs: ensure-main
    if: needs.ensure-main.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_repository: ${{ steps.source.outputs.image_repository }}
      image_tag: ${{ steps.source.outputs.image_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@e265ebca9b4a93aaf804be57c2687554dcc49dc7
        with:
          repository: fewensa/codeoo
          token: "${{ secrets.GH_TOKEN_FEWENSA }}"
          ref_file: .github/ref.txt

      - name: Verify source revision and main head
        run: |
          expected="$(cat __origin__/.github/commit.txt)"
          actual_short="$(git rev-parse --short=7 HEAD)"
          actual_full="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$actual_short" = "$expected"
          test "$actual_full" = "$remote_main"

      - name: Resolve source image tag
        id: source
        run: |
          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.source.outputs.image_tag }}
            ${{ env.IMAGE_REPOSITORY }}:staging
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-deployment-source:
    name: Verify deployment source
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@e265ebca9b4a93aaf804be57c2687554dcc49dc7
        with:
          repository: fewensa/codeoo
          token: "${{ secrets.GH_TOKEN_FEWENSA }}"
          ref_file: .github/ref.txt

      - name: Verify source revision and main head
        run: |
          expected="$(cat __origin__/.github/commit.txt)"
          actual_short="$(git rev-parse --short=7 HEAD)"
          actual_full="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$actual_short" = "$expected"
          test "$actual_full" = "$remote_main"

  deploy-codeoff:
    name: Deploy Codeoff
    needs:
      - build-image
      - verify-deployment-source
    runs-on: ubuntu-latest
    concurrency:
      group: codeoo-infra-production-codeoff-de0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@e265ebca9b4a93aaf804be57c2687554dcc49dc7
        with:
          repository: fewensa/codeoo
          token: "${{ secrets.GH_TOKEN_FEWENSA }}"
          ref_file: .github/ref.txt

      - name: Recheck main head
        env:
          IMAGE_TAG: ${{ needs.build-image.outputs.image_tag }}
        run: |
          image_sha="${IMAGE_TAG#sha-}"
          actual_full="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$actual_full" = "$image_sha"
          test "$actual_full" = "$remote_main"

      - name: Checkout GitOps repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: repotea-workflow/gitops-fes
          ssh-key: "${{ secrets.DEPLOY_KEY_GITOPS_FES }}"
          path: gitops-repo
          fetch-depth: 0

      - name: Configure production authorization
        shell: bash
        run: |
          set -euo pipefail

          chart_template="gitops-repo/charts/infra/codeoff-helm/templates/configmap.yaml"
          chart_values="gitops-repo/charts/infra/codeoff-helm/values.yaml"
          production_values="gitops-repo/argocd/infra/codeoff-de0/overlays/production/codeoff/values.yaml"

          if ! grep -q 'scheduled_github_capabilities_enabled' "$chart_template"; then
            perl -0pi -e \
              's/(    delivery_claims_enabled = \{\{ \.Values\.scheduler\.deliveryClaimsEnabled \}\}\n)/$1    scheduled_github_capabilities_enabled = {{ .Values.scheduler.scheduledGithubCapabilitiesEnabled }}\n    scheduled_github_write_capabilities_enabled = {{ .Values.scheduler.scheduledGithubWriteCapabilitiesEnabled }}\n/' \
              "$chart_template"
          fi

          if ! grep -q '^  scheduledGithubCapabilitiesEnabled:' "$chart_values"; then
            perl -0pi -e \
              's/(  deliveryClaimsEnabled: false\n)/$1  scheduledGithubCapabilitiesEnabled: false\n  scheduledGithubWriteCapabilitiesEnabled: false\n/' \
              "$chart_values"
          fi

          if ! grep -q '^  scheduledGithubCapabilitiesEnabled:' "$production_values"; then
            perl -0pi -e \
              's/(  deliveryClaimsEnabled: true\n)/$1  scheduledGithubCapabilitiesEnabled: true\n  scheduledGithubWriteCapabilitiesEnabled: false\n/' \
              "$production_values"
          fi

          if ! grep -q '^  \[authorization\]$' "$production_values"; then
            perl -0pi -e \
              's/^codexConfig: \|/  [authorization]\n  enabled = true\n\n  [[authorization.owners]]\n  provider = "slack"\n  workspace_id = "T01GRMKUW1W"\n  actor_id = "U01P78FFM2B"\n+\ncodexConfig: |/m' \
              "$production_values"
          fi

          grep -q 'scheduled_github_capabilities_enabled = {{ .Values.scheduler.scheduledGithubCapabilitiesEnabled }}' "$chart_template"
          grep -q 'scheduled_github_write_capabilities_enabled = {{ .Values.scheduler.scheduledGithubWriteCapabilitiesEnabled }}' "$chart_template"
          grep -q '^  scheduledGithubCapabilitiesEnabled: false$' "$chart_values"
          grep -q '^  scheduledGithubWriteCapabilitiesEnabled: false$' "$chart_values"
          grep -q '^  scheduledGithubCapabilitiesEnabled: true$' "$production_values"
          grep -q '^  scheduledGithubWriteCapabilitiesEnabled: false$' "$production_values"
          grep -q '^  \[authorization\]$' "$production_values"
          grep -q '^  enabled = true$' "$production_values"
          grep -q '^  \[\[authorization.owners\]\]$' "$production_values"
          grep -q '^  provider = "slack"$' "$production_values"
          grep -q '^  workspace_id = "T01GRMKUW1W"$' "$production_values"
          grep -q '^  actor_id = "U01P78FFM2B"$' "$production_values"

      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@e265ebca9b4a93aaf804be57c2687554dcc49dc7
        with:
          repository: repotea-workflow/gitops-fes
          deploy_key: "${{ secrets.DEPLOY_KEY_GITOPS_FES }}"
          argocd_server: ${{ secrets.ARGOCD_FES_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_FES_API_TOKEN }}
          app_name: infra-production-codeoff-de0
          wait_health: "true"
          changes: |
            {
              "argocd/infra/codeoff-de0/overlays/production/codeoff/values.yaml": {
                "image.repository": "${{ needs.build-image.outputs.image_repository }}",
                "image.tag": "${{ needs.build-image.outputs.image_tag }}",
                "image.digest": "${{ needs.build-image.outputs.image_digest }}",
                "imagePullSecrets": [{"name": "dockercfg-0xfe10"}]
              }
            }
