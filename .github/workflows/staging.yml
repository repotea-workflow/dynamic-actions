name: "[gprinter] Staging"

on:
  push:
    branches:
      - "**"

concurrency:
  group: gprinter-staging
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI: crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com
  DOCKER_NAMESPACE_ALI: coohub
  PLATE_ALLOWED_PARENT_ORIGIN: https://gprinter-stg.taiok.life
  PLATE_EDITOR_HOST_PATH: apps/admin/public/plate-editor
  PLATE_REF: 7f1978f516dc4e3a3512eb3584ba9f98c1077d82
  PLATE_REPOSITORY: boxliy/plate

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.ENSURE_MAIN }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure main
        id: ensure_main
        run: |
          if [ -f .github/branch.txt ] && [ "$(cat .github/branch.txt)" = main ]; then
            echo "ENSURE_MAIN=true" >> "$GITHUB_OUTPUT"
          else
            echo "ENSURE_MAIN=false" >> "$GITHUB_OUTPUT"
          fi

  build-office:
    name: Publish Office converter to Aliyun
    runs-on: ubuntu-latest
    needs: [ensure-main]
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    outputs:
      digest: ${{ steps.office.outputs.digest }}
      source_sha: ${{ steps.office-source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/gprinter
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref_file: .github/ref.txt
      - name: Docker login (Aliyun Shenzhen)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}
      - uses: docker/setup-buildx-action@v3
      - name: Resolve Office source revision
        id: office-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish pinned Office image
        id: office
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/office-converter.Dockerfile
          provenance: false
          sbom: false
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_REGISTRY_ALI }}/${{ env.DOCKER_NAMESPACE_ALI }}/repotea-workspace_gprinter_office-converter:sha-${{ steps.office-source.outputs.sha }}

  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      digest: ${{ steps.published.outputs.digest }}
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Set source repo name
        run: |
          SOURCE_REPOSITORY="$(cat .github/repository.txt)"
          echo "REPO_NAME=${SOURCE_REPOSITORY//\//_}" >> "$GITHUB_ENV"

      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/gprinter
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun Shenzhen)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/gprinter-api:sha-${{ env.SHA }}" >> "$GITHUB_OUTPUT"
          echo "ghcr_staging=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/gprinter-api:staging" >> "$GITHUB_OUTPUT"
          echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI }}/${{ env.DOCKER_NAMESPACE_ALI }}/${{ env.REPO_NAME }}_gprinter-api:sha-${{ env.SHA }}" >> "$GITHUB_OUTPUT"
          echo "ali_staging=${{ env.DOCKER_REGISTRY_ALI }}/${{ env.DOCKER_NAMESPACE_ALI }}/${{ env.REPO_NAME }}_gprinter-api:staging" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/gprinter-api.Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.ghcr_staging }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker pull ${{ steps.tags.outputs.ghcr_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_staging }}
            docker push ${{ steps.tags.outputs.ali_sha }}
            docker push ${{ steps.tags.outputs.ali_staging }}

      - name: Resolve published immutable image
        id: published
        run: |
          digest="$(docker buildx imagetools inspect '${{ steps.tags.outputs.ali_sha }}' --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  build-admin:
    name: Build Admin image
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      digest: ${{ steps.published.outputs.digest }}
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Set source repo name
        run: |
          SOURCE_REPOSITORY="$(cat .github/repository.txt)"
          echo "REPO_NAME=${SOURCE_REPOSITORY//\//_}" >> "$GITHUB_ENV"

      - name: Checkout source repository
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/gprinter
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout Plate editor host
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PLATE_REPOSITORY }}
          ref: ${{ env.PLATE_REF }}
          path: vendor/plate
          persist-credentials: false
          token: ${{ secrets.GH_TOKEN_0X128BIT }}

      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Build Gprinter Plate editor host
        working-directory: apps/plate_editor_host
        run: |
          printf 'dependency_overrides:\n  plate_editor_support:\n    path: ../../vendor/plate/packages/plate_editor_support\n' > pubspec_overrides.yaml
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build web \
            --no-pub \
            --release \
            --base-href /plate-editor/ \
            --dart-define=PLATE_ALLOWED_PARENT_ORIGIN=${PLATE_ALLOWED_PARENT_ORIGIN}

      - name: Install Plate editor host into admin static assets
        run: |
          mkdir -p "${PLATE_EDITOR_HOST_PATH}"
          cp -R apps/plate_editor_host/build/web/. "${PLATE_EDITOR_HOST_PATH}/"

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun Shenzhen)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/gprinter-admin:sha-${{ env.SHA }}" >> "$GITHUB_OUTPUT"
          echo "ghcr_staging=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/gprinter-admin:staging" >> "$GITHUB_OUTPUT"
          echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI }}/${{ env.DOCKER_NAMESPACE_ALI }}/${{ env.REPO_NAME }}_gprinter-admin:sha-${{ env.SHA }}" >> "$GITHUB_OUTPUT"
          echo "ali_staging=${{ env.DOCKER_REGISTRY_ALI }}/${{ env.DOCKER_NAMESPACE_ALI }}/${{ env.REPO_NAME }}_gprinter-admin:staging" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/gprinter-admin.Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.ghcr_staging }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker pull ${{ steps.tags.outputs.ghcr_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_staging }}
            docker push ${{ steps.tags.outputs.ali_sha }}
            docker push ${{ steps.tags.outputs.ali_staging }}

      - name: Resolve published immutable image
        id: published
        run: |
          digest="$(docker buildx imagetools inspect '${{ steps.tags.outputs.ali_sha }}' --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs:
      - build-api
      - build-admin
      - build-office
    steps:
      - name: Verify matching source revisions
        env:
          API_SHA: ${{ needs.build-api.outputs.source_sha }}
          ADMIN_SHA: ${{ needs.build-admin.outputs.source_sha }}
          OFFICE_SHA: ${{ needs.build-office.outputs.source_sha }}
        run: |
          test "$API_SHA" = "$ADMIN_SHA"
          test "$API_SHA" = "$OFFICE_SHA"

      - uses: actions/checkout@v6

      - uses: benjlevesque/short-sha@v3.0

      - name: Set source repo name
        run: |
          SOURCE_REPOSITORY="$(cat .github/repository.txt)"
          echo "REPO_NAME=${SOURCE_REPOSITORY//\//_}" >> "$GITHUB_ENV"

      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-fes
          deploy_key: "${{ secrets.DEPLOY_KEY_GITOPS_FES }}"
          argocd_server: ${{ secrets.ARGOCD_FES_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_FES_API_TOKEN }}
          app_name: work-staging-gprinter-qshz
          wait_health: true
          changes: |
            {
              "argocd/work/gprinter-qshz/overlays/staging/gprinter/values.yaml": {
                "images.api.repository": "${{ env.DOCKER_REGISTRY_ALI }}/${{ env.DOCKER_NAMESPACE_ALI }}/${{ env.REPO_NAME }}_gprinter-api",
                "images.api.tag": "sha-${{ env.SHA }}",
                "images.api.digest": "${{ needs.build-api.outputs.digest }}",
                "images.admin.repository": "${{ env.DOCKER_REGISTRY_ALI }}/${{ env.DOCKER_NAMESPACE_ALI }}/${{ env.REPO_NAME }}_gprinter-admin",
                "images.admin.tag": "sha-${{ env.SHA }}",
                "images.admin.digest": "${{ needs.build-admin.outputs.digest }}",
                "officeConverter.image": "${{ env.DOCKER_REGISTRY_ALI }}/${{ env.DOCKER_NAMESPACE_ALI }}/repotea-workspace_gprinter_office-converter@${{ needs.build-office.outputs.digest }}"
              }
            }

      - name: Checkout verified source for staging smoke
        uses: actions/checkout@v6
        with:
          repository: repotea-workspace/gprinter
          ref: ${{ needs.build-api.outputs.source_sha }}
          path: staging-source
          persist-credentials: false
          token: ${{ secrets.GH_TOKEN_0XFE10 }}

      - name: Verify deployed revision and real Office conversion
        env:
          SOURCE_SHA: ${{ needs.build-api.outputs.source_sha }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          ADMIN_DIGEST: ${{ needs.build-admin.outputs.digest }}
          OFFICE_DIGEST: ${{ needs.build-office.outputs.digest }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_FES_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_FES_API_TOKEN }}
        run: python3 -B staging-source/infra/ci/staging_smoke.py

      - name: Save staging rollout and conversion evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: gprinter-staging-evidence-${{ needs.build-api.outputs.source_sha }}
          path: staging-evidence/evidence.json
          if-no-files-found: error
          retention-days: 30
