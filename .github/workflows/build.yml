name: "[workbot] Workbot image"

on:
  push:
    branches: ["0xfe10/workbot"]
    tags: ["v*-workbot"]

concurrency:
  group: workbot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/0xfe10/workbot/workbot

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Resolve immutable Workbot source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0XFE10 }}
        run: |
          set -euo pipefail
          test "$(cat .github/repository.txt)" = "0xfe10/workbot"
          source_ref=$(cat .github/commit.txt)
          [[ "$source_ref" =~ ^[0-9a-f]{7,40}$ ]]
          revision=$(gh api "repos/0xfe10/workbot/commits/$source_ref" --jq .sha)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "publish=false" >> "$GITHUB_OUTPUT"
          # The existing repository-owned branch trigger forwards trusted source
          # commits to this exact execution branch. Publish each verified build
          # by source SHA so an unmerged PR can be tested without a release tag.
          if [[ "$GITHUB_REF" == refs/heads/0xfe10/workbot ]]; then
            test -s .github/branch.txt
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            source_tag=$(cat .github/tag.txt)
            [[ "$source_tag" =~ ^v[A-Za-z0-9_.-]{0,127}$ ]]
            test "$GITHUB_REF_NAME" = "${source_tag}-workbot"
            tag_revision=$(gh api "repos/0xfe10/workbot/commits/$source_tag" --jq .sha)
            test "$tag_revision" = "$revision"
            echo "tag=$source_tag" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out Workbot source
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: 0xfe10/workbot
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          ref: ${{ steps.source.outputs.revision }}
          source_context: "true"
          image_name: workbot
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/weauto-bridge
      - name: Test Pi memory lifecycle
        run: docker run --rm -v "$PWD:/src:ro" -w /src node:22-slim node --test integrations/pi/test_hindsight.mjs
      - name: Test managed agent cron jobs
        run: python3 -m unittest discover -s integrations/workbot -v
      - name: Test weauto bridge
        run: cargo test --locked --manifest-path crates/weauto-bridge/Cargo.toml
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: steps.source.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: 0xfe10
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
      - name: Build candidate or publish tagged image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ steps.source.outputs.publish == 'true' }}
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}
          cache-from: type=gha,scope=workbot
          cache-to: type=gha,mode=max,scope=workbot
      - name: Report immutable image
        if: steps.source.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf 'Source: `%s`\n\nImage: `%s@%s`\n' "$SOURCE_REVISION" "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
